<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Traditional Sikkim Endless Knot (Srivatsa / Dpal be'u) in Navy Blue -->
  <defs>
    <style>
      .knot-base { fill: none; stroke: #0b3466; stroke-width: 22; stroke-linecap: square; stroke-linejoin: miter; }
      .knot-gap  { fill: none; stroke: #fcfcfc; stroke-width: 34; stroke-linecap: square; stroke-linejoin: miter; }
    </style>
  </defs>
  <g transform="translate(250,250) scale(1.1) translate(-250,-250)">
    <!-- Top Apex Loop -->
    <path class="knot-base" d="M 250,50 L 310,110 L 250,170 L 190,110 Z" />
    <!-- Bottom Apex Loop -->
    <path class="knot-base" d="M 250,330 L 310,390 L 250,450 L 190,390 Z" />
    
    <!-- Top-Left & Top-Right Wing Loops -->
    <path class="knot-gap" d="M 180,120 L 240,180 L 180,240 L 120,180 Z" />
    <path class="knot-base" d="M 180,120 L 240,180 L 180,240 L 120,180 Z" />
    
    <path class="knot-gap" d="M 320,120 L 380,180 L 320,240 L 260,180 Z" />
    <path class="knot-base" d="M 320,120 L 380,180 L 320,240 L 260,180 Z" />

    <!-- Left & Right Outer Pointed Wing Loops -->
    <path class="knot-gap" d="M 110,190 L 170,250 L 110,310 L 50,250 Z" />
    <path class="knot-base" d="M 110,190 L 170,250 L 110,310 L 50,250 Z" />

    <path class="knot-gap" d="M 390,190 L 450,250 L 390,310 L 330,250 Z" />
    <path class="knot-base" d="M 390,190 L 450,250 L 390,310 L 330,250 Z" />

    <!-- Bottom-Left & Bottom-Right Wing Loops -->
    <path class="knot-gap" d="M 180,260 L 240,320 L 180,380 L 120,320 Z" />
    <path class="knot-base" d="M 180,260 L 240,320 L 180,380 L 120,320 Z" />

    <path class="knot-gap" d="M 320,260 L 380,320 L 320,380 L 260,320 Z" />
    <path class="knot-base" d="M 320,260 L 380,320 L 320,380 L 260,320 Z" />

    <!-- Central Interlocking Diamonds -->
    <path class="knot-gap" d="M 250,190 L 310,250 L 250,310 L 190,250 Z" />
    <path class="knot-base" d="M 250,190 L 310,250 L 250,310 L 190,250 Z" />
  </g>
</svg>
