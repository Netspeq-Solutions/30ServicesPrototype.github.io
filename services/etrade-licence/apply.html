<!DOCTYPE html>
<html lang="en" data-font-size="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Application form - e-Trade Licence, Urban Development Department, Government of Sikkim.">
  <title>Application Form | e-Trade Licence | Government of Sikkim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../common/css/gigw-template.css">
  <link rel="stylesheet" href="../../common/css/themes.css">
  <link rel="stylesheet" href="../../common/css/components.css">
  <link rel="stylesheet" href="../../common/css/responsive.css">
  <link rel="stylesheet" href="tl-common.css?v=20261124">
</head>
<body data-theme="teal">
  <main id="main-content">
    <nav aria-label="Breadcrumb" class="mb-2"><ol class="breadcrumb small mb-0">
      <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
      <li class="breadcrumb-item"><a href="dashboard.html#applications">My Applications</a></li>
      <li class="breadcrumb-item active" aria-current="page" id="crumb">Application Form</li>
    </ol></nav>
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3">
      <div>
        <div class="d-flex align-items-center gap-2 flex-wrap mb-1"><h1 class="h4 fw-bold mb-0" id="pageTitle">Application Form</h1><span id="pageKind"></span></div>
        <p class="text-muted small mb-0" id="pageSubtitle"></p>
      </div>
    </div>
    <div id="formRoot" class="mx-auto" style="max-width: 980px;"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="mock-data.js?v=20261124"></script>
  <script src="tl-app.js?v=20261124"></script>
  <script src="tl-flow.js?v=20261124"></script>
  <script src="tl-view.js?v=20261124"></script>
  <script>
    (function () {
      'use strict';
      var App = window.TLApp, F = window.TLFlow, V = window.TLView, D = App.data, esc = App.esc, inr = App.inr, ST = F.ST;
      var session = App.requireSession('applicant');
      if (!session) return;
      var active = App.qs('type') === 'new' ? 'apply' : 'applications';
      App.shell({ type: 'applicant', active: active });
      var $ = function (id) { return document.getElementById(id); };
      var root = $('formRoot');
      var biz = App.currentBusiness(session);

      function stop(html) { root.innerHTML = '<div class="alert alert-warning">' + html + '</div><a class="btn btn-sm btn-outline-secondary" href="dashboard.html">Back to Dashboard</a>'; }
      function clone(o) { return JSON.parse(JSON.stringify(o)); }

      // ---------- Work out the mode ----------
      var mode, stored = null, w, lic = null;
      var appId = App.qs('app'), type = App.qs('type');
      if (appId) {
        stored = App.app(appId);
        if (!stored || stored.businessKey !== session.scenario) return stop('Application ' + esc(appId) + ' was not found for this business.');
        if (stored.status !== ST.DRAFT && stored.status !== ST.RETURNED) return stop('Application <a href="application.html?app=' + encodeURIComponent(appId) + '">' + esc(appId) + '</a> is ' + esc(stored.status.toLowerCase()) + ' and cannot be edited now.');
        w = clone(stored);
        mode = stored.status === ST.RETURNED ? 'correct' : 'draft';
        lic = w.licenceNo ? App.licence(w.licenceNo) : null;
      } else if (type === 'renewal' || type === 'change') {
        lic = App.licence(App.qs('licence'));
        if (!lic || lic.businessKey !== session.scenario) return stop('Licence not found for this business.');
        var chk = type === 'renewal' ? F.renewalCheck(lic) : F.changeCheck(lic);
        if (!chk.ok) return stop(esc(chk.reason));
        // Start from the details held on the licence (from its application and later renewals / changes).
        var form = F.licenceDetails(lic);
        var ps = clone(F.purposesOf(lic));
        w = { appId: null, kind: type === 'renewal' ? 'Renewal' : 'Change', licenceNo: lic.licenceNo, businessKey: session.scenario, circle: lic.circle, applicantType: lic.applicantType, purposes: ps, prevPurposes: clone(ps), category: lic.category, item: lic.item, orgType: lic.orgType,
          form: form, docs: {}, br: null, change: type === 'change' ? { types: [], old: clone(form) } : null };
        mode = type;
      } else {
        // Sikkim GO is only the identity provider: pre-fill the applicant's name, mobile and email; everything else is entered here.
        w = { appId: null, kind: 'New', licenceNo: null, businessKey: session.scenario, circle: '', applicantType: '', purposes: [], category: '', item: '', orgType: '', docs: {}, br: null, change: null,
          form: { applyFor: 'new', applicantName: biz.authName, mobile: biz.mobile, email: biz.email, presSame: true } };
        mode = 'new';
      }
      var kind = w.kind;
      var newFiles = {}; // doc key → File chosen in this session
      function tp() { return F.typeOf(w); }

      // ---------- Which fields / documents can be edited ----------
      var PURPOSE_KEYS = ['applicantType', 'category', 'item', 'otherPurpose'];
      var corr = mode === 'correct' ? stored.correction : null;
      var corrAll = corr && !(corr.fields || []).length && !(corr.docs || []).length;
      function editable(key) {
        if (mode === 'correct') return corrAll || corr.fields.indexOf(key) !== -1 || (PURPOSE_KEYS.indexOf(key) !== -1 && corr.fields.indexOf('category') !== -1);
        if (PURPOSE_KEYS.indexOf(key) !== -1) return kind === 'New' || F.changesPurpose(w);
        if (kind === 'Renewal') return F.renewalFields(w).indexOf(key) !== -1;
        if (kind === 'Change') return F.changeFields(w).indexOf(key) !== -1;
        return true;
      }
      function docEditable(key) {
        return mode !== 'correct' || corrAll || corr.docs.indexOf(key) !== -1 || corr.fields.indexOf('category') !== -1 || !w.docs[key];
      }
      function flagged(key) { return mode === 'correct' && !corrAll && (corr.fields.indexOf(key) !== -1 || corr.docs.indexOf(key) !== -1); }

      // ---------- Header ----------
      var titles = { New: 'Apply for New Licence', Renewal: 'Request Renewal of Licence', Change: 'Request Change to Licence' };
      $('pageTitle').textContent = mode === 'correct' ? 'Correct & Resubmit' : titles[kind];
      $('crumb').textContent = mode === 'correct' ? 'Correct & Resubmit' : titles[kind];
      $('pageKind').innerHTML = App.kindBadge(w) + (w.appId ? ' <span class="tl-ref-id small ms-1">' + esc(w.appId) + '</span>' : '');
      $('pageSubtitle').innerHTML = kind === 'New' ? 'For individuals / firms and registered companies, and for renewing a licence issued before this system. The form and the documents asked for follow the applicant type and purpose you choose.' :
        'Licence <span class="tl-ref-id">' + esc(w.licenceNo) + '</span> &bull; ' + esc(lic ? F.currentVersion(lic).businessName : '') + (kind === 'Change' ? ' &bull; your licence stays valid while this request is processed.' : '');

      // ---------- Steps ----------
      // Instructions come first (documents, formats, acknowledgement); not repeated when correcting a returned application.
      var STEPS = kind === 'Renewal' ? ['details', 'items', 'docs', 'review'] : (kind === 'Change' ? ['changeType', 'changeDetails', 'docs', 'review'] : ['purpose', 'applicant', 'premises', 'docs', 'review']);
      if (mode !== 'correct') STEPS.unshift('instructions');
      var LABELS = { instructions: 'Instructions', purpose: 'Type & Purpose', applicant: 'Applicant', premises: 'Premises & Business', details: 'Licence & Contact', items: 'Items (Add / Remove)', changeType: 'Change Type', changeDetails: 'New Details', docs: 'Documents', review: 'Review & Submit' };
      // A saved draft has already accepted the instructions: open it at the next step.
      var step = mode === 'draft' && w.instructionsAck ? 1 : 0;
      var fromReview = false; // opened a step with Edit on the review page

      function req(on) { return on ? ' <span class="text-danger" aria-hidden="true">*</span>' : ''; }
      function inputHtml(f, val, on) {
        var id = 'f_' + f.key, dis = on ? '' : ' disabled', v = val == null ? '' : val, t = F.inputType(f, tp());
        if (t === 'textarea') return '<textarea id="' + id + '" class="form-control" rows="2"' + dis + '>' + esc(v) + '</textarea>';
        if (t === 'date') return '<input id="' + id + '" class="form-control" type="date" max="' + D.demoToday + '" value="' + esc(v) + '"' + dis + '>';
        if (t === 'select' || t === 'district' || t === 'yesno') {
          var opts = t === 'district' ? D.config.districts : (t === 'yesno' ? ['Yes', 'No'] : f.options);
          return '<select id="' + id + '" class="form-select"' + dis + '><option value="">Select</option>' + opts.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
        }
        return '<input id="' + id + '" class="form-control' + (f.mono ? ' font-monospace' : '') + '" type="' + (t === 'number' ? 'number' : 'text') + '"' + (t === 'number' ? ' min="' + (f.min || 1) + '"' + (f.max ? ' max="' + f.max + '"' : '') : '') + ' value="' + esc(v) + '"' + dis + '>';
      }
      var NARROW = ['perm', 'present', 'firm', 'hotel', 'franchise'];
      function fieldsHtml(section, onlyKeys) {
        var list = (section ? F.fieldsFor(w, section) : F.FIELDS.filter(function (f) { return F.applies(f, w); }))
          .filter(function (f) { return !onlyKeys || onlyKeys.indexOf(f.key) !== -1; });
        return list.map(function (f) {
          var on = editable(f.key), fl = flagged(f.key), label = esc(F.labelOf(f, tp())), badge = fl ? ' <span class="badge bg-warning text-dark ms-1">Correct this</span>' : '';
          if (f.type === 'check') return '<div class="col-12"><div class="form-check' + (fl ? ' tl-flagged border rounded p-2 ps-4' : '') + '"><input class="form-check-input" type="checkbox" id="f_' + f.key + '"' + (w.form[f.key] ? ' checked' : '') + (on ? '' : ' disabled') + '><label class="form-check-label small fw-semibold" for="f_' + f.key + '">' + label + badge + '</label></div></div>';
          var wide = f.type === 'textarea' || /Name$/.test(f.key) && f.section === 'applicant' || f.key === 'firmName';
          var col = wide ? 'col-12' + (f.type === 'textarea' ? '' : ' col-md-6') : (NARROW.indexOf(f.section) !== -1 ? 'col-sm-6 col-lg-4' : 'col-md-6');
          return '<div class="' + col + '"><div class="' + (fl ? 'tl-flagged border rounded p-2' : '') + '"><label for="f_' + f.key + '" class="form-label small fw-semibold">' + label + req(F.isRequired(f, w) && on) + badge + '</label>' +
            inputHtml(f, w.form[f.key], on) + (f.hint && on ? '<div class="form-text">' + esc(f.hint) + '</div>' : '') + (f.key === 'premDistrict' && on ? '<div class="form-text">Any district. Businesses in other districts may also apply to the North-East Circle (Headquarters).</div>' : '') + '</div></div>';
        }).join('');
      }
      // edit: step key – shows an Edit button (review page) that opens that step.
      function card(title, body, sub, edit) {
        var btnEdit = edit && STEPS.indexOf(edit) !== -1 ? '<button type="button" class="btn btn-sm btn-outline-primary" data-goto="' + edit + '"><i class="bi bi-pencil me-1" aria-hidden="true"></i>Edit<span class="visually-hidden"> ' + title.replace(/<[^>]+>/g, '') + '</span></button>' : '';
        return '<div class="card border-0 shadow-xs mb-3"><div class="card-header bg-white' + (btnEdit ? ' d-flex justify-content-between align-items-start gap-2' : '') + '"><div class="min-w-0"><h2 class="h6 fw-bold mb-0">' + title + '</h2>' + (sub ? '<div class="small text-muted">' + sub + '</div>' : '') + '</div>' + btnEdit + '</div><div class="card-body">' + body + '</div></div>';
      }
      function sectionCard(sec, sub) { var body = fieldsHtml(sec); return body ? card(esc(F.sectionLabel(sec, tp())), '<div class="row g-3">' + body + '</div>', sub) : ''; }
      // Step that holds a form section (for the Edit buttons on the review page).
      var SECTION_STEP = { oldLicence: 'purpose', applicant: 'applicant', perm: 'applicant', present: 'applicant', contact: 'applicant', firm: 'premises', hotel: 'premises', franchise: 'premises', education: 'premises' };
      function licenceSummary() {
        var v = F.currentVersion(lic);
        return '<dl class="tl-dl"><dt>Licence number</dt><dd><span class="tl-ref-id">' + esc(lic.licenceNo) + '</span></dd><dt>Business</dt><dd>' + esc(v.businessName) + '</dd><dt>Items</dt><dd>' + V.purposeList({ purposes: F.purposesOf(lic), form: lic.details }) + '</dd>' +
          '<dt>Premises</dt><dd>' + esc(v.premisesAddress) + ', ' + esc(v.locality) + ', ' + esc(v.district) + '</dd><dt>Valid up to</dt><dd>' + App.fmtDate(lic.validTo) + ' ' + App.pill(F.licenceState(lic)) + '</dd><dt>Circle</dt><dd>' + esc(App.circle(lic.circle).name) + '</dd></dl>';
      }
      function docBox(d) {
        var k = d.key, cur = w.docs[k], on = docEditable(k), fl = flagged(k), why = d.why, fmt = F.formatUrl(k), multi = k === 'changeSupport';
        var title = esc(F.docLabel(k)) + (d.req ? '' : ' <span class="badge bg-light text-secondary border ms-1">optional</span>') + (fl ? ' <span class="badge bg-warning text-dark ms-1">Upload again</span>' : '');
        var extra = (why ? '<div class="small text-muted mb-2"><i class="bi bi-info-circle me-1" aria-hidden="true"></i>Asked for: ' + esc(why) + '</div>' : '') +
          (fmt ? '<a class="btn btn-sm btn-outline-primary mb-2" href="' + fmt + '" target="_blank" rel="noopener"><i class="bi bi-download me-1" aria-hidden="true"></i>Download Format</a>' : '');
        if (!on) return '<div class="col-md-6"><div class="p-3 rounded border bg-light h-100"><div class="small fw-semibold mb-1">' + title + '</div>' +
          '<div class="small text-muted mb-2"><i class="bi bi-lock me-1" aria-hidden="true"></i>Not asked to change</div><div class="tl-thumbs">' + (cur ? (cur.files || [cur.file]).map(function (x) { return App.fileThumb(x, x, F.docLabel(k), 'Version ' + cur.v); }).join('') : '') + '</div></div></div>';
        return '<div class="col-md-6"><div class="p-3 rounded border h-100' + (fl ? ' tl-flagged' : ' bg-light') + '">' + extra +
          App.dropzone({ id: 'd_' + k, label: title, required: d.req, multiple: multi, docType: F.docLabel(k), current: cur ? cur.file : '', currentLabel: cur ? 'Uploaded (version ' + cur.v + ')' + (fl ? ' – replace it' : '') : '', attrs: ' data-doc="' + k + '"',
            help: k === 'photo' ? 'Recent passport-size photo, JPG or PNG, up to 5 MB' : (multi ? 'Any other papers for this change. PDF, JPG or PNG, up to 5 MB each; you can add several.' : null) }) + '</div></div>';
      }

      // ---------- Items and sub-items (multi-select) ----------
      // From the items master; a record already holding an inactive entry still shows it.
      // For a renewal or change request, items added and removed against the licence are marked.
      var pFilter = '';
      function markOf(was, is) {
        if (!w.prevPurposes) return '';
        return is && !was ? ' <span class="badge bg-success-subtle text-success-emphasis border border-success-subtle">added</span>' : (!is && was ? ' <span class="badge bg-light text-secondary border">removed</span>' : '');
      }
      function purposePicker(lockP) {
        var chosen = F.purposesOf(w), keys = chosen.map(F.purposeKey), prev = w.prevPurposes || [], prevKeys = prev.map(F.purposeKey);
        var cats = F.categoriesOf(w.applicantType).concat(F.categoriesOf(w.applicantType, true).filter(function (c) { return c.active === false && F.hasCategory(w, c.code); }));
        var dis = lockP ? ' disabled' : '', fl = flagged('category');
        var list = cats.map(function (c, n) {
          var on = F.hasCategory(w, c.code), wasCat = prev.some(function (p) { return p.category === c.code; });
          var subs = F.items(c.code).concat(F.items(c.code, true).filter(function (i) { return i.active === false && keys.indexOf(c.code + '|' + i.name) !== -1; }));
          var body = '';
          if (on && c.code === 'OTHER') {
            var cur = chosen.filter(function (p) { return p.category === 'OTHER'; })[0] || {};
            var groups = F.categoriesOf('IND').map(function (g) {
              var gs = F.items(g.code);
              return '<optgroup label="' + esc(g.name) + '">' + (gs.length ? gs : [g]).map(function (x) { return '<option' + (x.name === cur.item ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</optgroup>';
            }).join('');
            body = '<div class="tl-purpose-subs row g-2"><div class="col-md-6"><label for="f_otherPurpose" class="form-label small fw-semibold">Describe exactly what the business is' + req(!lockP) + '</label><input id="f_otherPurpose" class="form-control form-control-sm" value="' + esc(w.form.otherPurpose || '') + '"' + dis + '></div>' +
              '<div class="col-md-6"><label for="p_item_OTHER" class="form-label small fw-semibold">Item / sub-item as per the UDD notification <span class="text-muted fw-normal">(if listed)</span></label><select id="p_item_OTHER" class="form-select form-select-sm"' + dis + '><option value="">Not listed</option>' + groups + '</select></div></div>';
          } else if (on && subs.length) {
            body = '<div class="tl-purpose-subs" role="group" aria-label="Sub-items of ' + esc(c.name) + '">' + subs.map(function (x, i) {
              var k = c.code + '|' + x.name, chk = keys.indexOf(k) !== -1, id = 'ps_' + c.code + '_' + i;
              return '<div class="form-check"><input class="form-check-input" type="checkbox" id="' + id + '" data-sub="' + c.code + '" value="' + esc(x.name) + '"' + (chk ? ' checked' : '') + dis + '><label class="form-check-label small" for="' + id + '">' + esc(x.name) + markOf(prevKeys.indexOf(k) !== -1, chk) + '</label></div>';
            }).join('') + '</div>';
          }
          var hay = (c.name + ' ' + subs.map(function (x) { return x.name; }).join(' ')).toLowerCase();
          return '<div class="tl-purpose-item' + (on ? ' is-on' : '') + '" data-hay="' + esc(hay) + '"><div class="form-check mb-0"><input class="form-check-input" type="checkbox" id="pc_' + c.code + '" data-cat="' + c.code + '"' + (on ? ' checked' : '') + dis + '>' +
            '<label class="form-check-label small fw-semibold" for="pc_' + c.code + '">' + (w.applicantType === 'IND' ? (n + 1) + '. ' : '') + esc(c.name) + '</label>' +
            (subs.length && c.code !== 'OTHER' ? ' <span class="small text-muted">&bull; ' + subs.length + ' sub-item' + (subs.length > 1 ? 's' : '') + '</span>' : '') + markOf(wasCat, on) + '</div>' + body + '</div>';
        }).join('');
        return '<div class="' + (fl ? 'tl-flagged border rounded p-2' : '') + '">' + (fl ? '<span class="badge bg-warning text-dark mb-2">Correct this</span>' : '') +
          '<div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-2"><div class="flex-grow-1 tl-purpose-filter"><label for="p_filter" class="form-label small fw-semibold mb-1">Find an item</label><input id="p_filter" type="search" class="form-control form-control-sm" placeholder="Type to filter the list" autocomplete="off"></div>' +
          '<div class="small fw-semibold text-primary" id="p_count" aria-live="polite"></div></div>' +
          '<div class="tl-purpose-list" id="p_list" role="group" aria-label="Items and sub-items">' + list + '<p class="small text-muted mb-0 d-none p-2" id="p_none">No item matches. Clear the filter to see all items.</p></div><div class="invalid-feedback d-block" id="p_err"></div></div>';
      }
      function purposeCount() {
        var el = $('p_count');
        if (!el) return;
        var n = F.purposesOf(w).filter(function (p) { return p.item || p.category === 'OTHER' || !F.items(p.category).length; }).length;
        el.textContent = n ? n + ' selected' : 'None selected';
      }
      function filterItems() {
        var q = pFilter.trim().toLowerCase(), shown = 0;
        root.querySelectorAll('.tl-purpose-item').forEach(function (it) {
          var vis = !q || it.classList.contains('is-on') || it.getAttribute('data-hay').indexOf(q) !== -1;
          it.classList.toggle('d-none', !vis);
          if (vis) shown++;
        });
        if ($('p_none')) $('p_none').classList.toggle('d-none', shown > 0);
        purposeCount();
      }
      // Read the ticked items: an item with sub-items holds one entry per ticked sub-item
      // ({ category, item: '' } until one is ticked); an item without sub-items holds one entry.
      function readPurposes() {
        var boxes = root.querySelectorAll('input[data-cat]');
        if (!boxes.length || boxes[0].disabled) return;
        var prev = F.purposesOf(w), next = [];
        root.querySelectorAll('input[data-cat]:checked').forEach(function (cb) {
          var code = cb.getAttribute('data-cat');
          if (code === 'OTHER') { var sel = $('p_item_OTHER'), old = prev.filter(function (p) { return p.category === 'OTHER'; })[0]; next.push({ category: 'OTHER', item: sel ? sel.value : (old ? old.item : '') }); return; }
          var subs = root.querySelectorAll('input[data-sub="' + code + '"]');
          if (subs.length) {
            var any = false;
            subs.forEach(function (x) { if (x.checked) { next.push({ category: code, item: x.value }); any = true; } });
            if (!any) next.push({ category: code, item: '' });
            return;
          }
          var its = F.items(code), kept = prev.filter(function (p) { return p.category === code && p.item; });
          if (!its.length) next.push({ category: code, item: '' });
          else if (kept.length) next = next.concat(kept);
          else next.push({ category: code, item: its.length === 1 ? its[0].name : '' });
        });
        if ($('f_otherPurpose') && !$('f_otherPurpose').disabled) w.form.otherPurpose = $('f_otherPurpose').value.trim();
        w.purposes = next;
        w.category = next.length ? next[0].category : '';
        w.item = next.length ? next[0].item : '';
      }
      function purposeGaps() {
        var ps = F.purposesOf(w), out = [];
        if (!ps.length) out.push('Choose at least one item (purpose of the licence).');
        ps.forEach(function (p) { if (!p.item && p.category !== 'OTHER' && F.items(p.category).length) out.push('Choose at least one sub-item of ' + App.category(p.category).name + '.'); });
        if (F.hasCategory(w, 'OTHER') && (w.form.otherPurpose || '').length < 3) out.push('Describe the business (Others).');
        return out;
      }
      function checkPurposes() {
        var err = $('p_err'), first = root.querySelector('input[data-cat]');
        if (!err || !first || first.disabled) return true;
        var gaps = purposeGaps();
        err.textContent = gaps.join(' ');
        if ($('f_otherPurpose')) App.fieldError($('f_otherPurpose'), (w.form.otherPurpose || '').length < 3 ? 'Describe the business.' : '');
        if (gaps.length) { var bad = root.querySelector('.tl-purpose-item.is-on input[data-sub]') || first; bad.focus(); }
        return !gaps.length;
      }

      var RENDER = {
        instructions: function () {
          var how, docs;
          if (kind === 'Renewal') {

      // What is still missing across all steps (a section may have been changed with Edit on the review page).
      function incomplete() {
        var out = [];
        if (kind === 'New') {
          if (!w.circle || !w.applicantType) out.push({ text: 'Circle and applicant type', step: 'purpose' });
          else purposeGaps().forEach(function (g) { out.push({ text: g, step: 'purpose' }); });
        } else if (F.changesPurpose(w)) purposeGaps().forEach(function (g) { out.push({ text: g, step: kind === 'Renewal' ? 'items' : 'changeDetails' }); });
        var fieldKeys = kind === 'Renewal' ? F.renewalFields(w) : (kind === 'Change' ? F.changeFields(w) : null);
        F.FIELDS.filter(function (f) { return F.applies(f, w) && F.isRequired(f, w) && f.type !== 'check' && editable(f.key) && (!fieldKeys || fieldKeys.indexOf(f.key) !== -1); }).forEach(function (f) {
          var v = w.form[f.key];
          if (v === '' || v == null) out.push({ text: F.labelOf(f, tp()), step: SECTION_STEP[f.section] || (kind === 'Renewal' ? 'details' : (kind === 'Change' ? 'changeDetails' : 'applicant')) });
        });
        F.docList(w).forEach(function (d) {
          if (d.req && !w.docs[d.key] && !newFiles[d.key]) out.push({ text: F.docLabel(d.key) + ' (document)', step: d.key === 'photo' ? 'applicant' : 'docs' });
        });
        return out;
      }

      // ---------- Read & validate the current step ----------
      function readStep() {
        var s = STEPS[step];
        if (s === 'instructions' && $('ackInstr')) w.instructionsAck = $('ackInstr').checked ? (w.instructionsAck || D.demoToday) : null;
        var af = document.querySelector('input[name="applyFor"]:checked:not([disabled])');
        if (af) w.form.applyFor = af.value;
        if (s === 'purpose') {
          var c = document.querySelector('input[name="circle"]:checked'), t = document.querySelector('input[name="ptype"]:checked:not([disabled])');
          if (c) w.circle = c.value;
          if (t && t.value !== w.applicantType) { w.applicantType = t.value; w.purposes = []; w.category = ''; w.item = ''; w.form.otherPurpose = ''; }
          else readPurposes();
        }
        if (s === 'items' || s === 'changeDetails') readPurposes();
        if (s === 'changeType') w.change.types = Array.prototype.slice.call(document.querySelectorAll('input[id^="t_"]:checked')).map(function (x) { return x.value; });
        F.FIELDS.forEach(function (f) {
          var el = $('f_' + f.key);
          if (!el || el.disabled) return;
          if (f.type === 'check') w.form[f.key] = el.checked;
          else if (f.type === 'number') w.form[f.key] = el.value === '' ? '' : +el.value;
          else w.form[f.key] = f.upper ? el.value.trim().toUpperCase() : el.value.trim();
        });
        root.querySelectorAll('input[data-doc]').forEach(function (el) {
          var k = el.getAttribute('data-doc'), files = el.files ? Array.prototype.slice.call(el.files) : [];
          if (files.length) { if (!App.checkFile(el, false)) newFiles[k] = files; }
          else delete newFiles[k];
        });
        F.derive(w);
      }
      function validateStep() {
        var s = STEPS[step], ok = true;
        if (s === 'instructions') return App.fieldError($('ackInstr'), w.instructionsAck ? '' : 'Tick the box to confirm you have read the instructions.');
        if (s === 'purpose') {
          if (!w.circle) { App.toast('Choose the circle where your premises are.', 'danger'); var c0 = root.querySelector('input[name="circle"]:not([disabled])'); if (c0) c0.focus(); return false; }
          if (!w.applicantType) { App.toast('Choose the applicant type.', 'danger'); return false; }
          ok = checkPurposes() && ok;
        }
        if (s === 'items' || (s === 'changeDetails' && F.changesPurpose(w))) ok = checkPurposes() && ok;
        if (s === 'changeType') { if (!w.change.types.length) { App.toast('Choose at least one change.', 'danger'); return false; } return true; }
        F.FIELDS.forEach(function (f) {
          var el = $('f_' + f.key);
          if (!el || el.disabled || f.type === 'check') return;
          var v = el.value.trim(), msg = '', label = F.labelOf(f, tp()).toLowerCase();
          if (F.isRequired(f, w) && !v) msg = (el.tagName === 'SELECT' ? 'Select ' : 'Enter ') + label.replace(/\?$/, '') + '.';
          else if (v && f.pattern && !f.pattern.test(f.upper ? v.toUpperCase() : v)) msg = 'Check the ' + label + (f.hint ? ' (' + f.hint + ')' : '') + '.';
          else if (f.type === 'number' && v && (+v < (f.min || 1) || (f.max && +v > f.max))) msg = 'Enter a number from ' + (f.min || 1) + (f.max ? ' to ' + f.max : '') + '.';
          else if (f.type === 'date' && v && v > D.demoToday) msg = 'The date cannot be in the future.';
          ok = App.fieldError(el, msg) && ok;
          if (!msg && f.upper) el.value = v.toUpperCase();
        });
        // The premises may be in any district (the North-East circle is the Headquarters), so the district is not checked against the circle.
        if (s === 'changeDetails' && ok && !F.changeFields(w).some(function (k) { return String(w.form[k]) !== String(w.change.old[k]); }) && !F.purposeChanged(w)) {
          App.toast(F.changeFields(w).length ? 'Enter the new details – they are the same as on the current licence.' : 'Add or remove at least one item.', 'danger');
          return false;
        }
        root.querySelectorAll('input[data-doc]').forEach(function (el) {
          var k = el.getAttribute('data-doc');
          var err = App.checkFile(el, false);
          if (!err && k === 'photo' && el.files && el.files[0] && !/\.(jpe?g|png)$/i.test(el.files[0].name)) err = 'Upload the photo as JPG or PNG.';
          if (err) { ok = App.fieldError(el, err) && ok; return; }
          if (el.files && el.files.length) newFiles[k] = Array.prototype.slice.call(el.files);
          var required = F.docRequired(w, k);
          var has = w.docs[k];
          var missing = required && !has && !newFiles[k];
          var mustNew = flagged(k) && !newFiles[k];
          ok = App.fieldError(el, missing ? 'Upload this document.' : (mustNew ? 'Upload a corrected file for this document.' : '')) && ok;
        });
        if (!ok) { var first = root.querySelector('.is-invalid'); if (first) first.focus(); }
        return ok;
      }

      function render(focusId) {
        var s = STEPS[step];
        $('pageKind').innerHTML = App.kindBadge(w) + (w.appId || stored ? ' <span class="tl-ref-id small ms-1">' + esc((stored || w).appId) + '</span>' : '');
        var stepper = '<ol class="gov-stepper tl-stepper" aria-label="Form progress">' + STEPS.map(function (x, i) {
          return '<li class="gov-step-item' + (i < step ? ' completed' : (i === step ? ' active' : '')) + '"' + (i === step ? ' aria-current="step"' : '') + '><span class="gov-step-circle">' + (i < step ? '<i class="bi bi-check-lg" aria-hidden="true"></i>' : i + 1) + '</span><span class="gov-step-label">' + LABELS[x] + '</span></li>';
        }).join('') + '</ol>';
        var banner = '';
        if (mode === 'correct') banner = '<div class="alert alert-warning small"><div class="fw-bold mb-1"><i class="bi bi-arrow-return-left me-1" aria-hidden="true"></i>Returned for correction by ' + esc(corr.by) + ' (' + esc(corr.role) + ') on ' + App.fmtDate(corr.on) + '</div>' + esc(corr.remarks) +
          '<div class="mt-1">' + (corrAll ? 'You may edit any field.' : 'Only the marked fields and documents can be changed.') + ' After you resubmit, it goes back to ' + (stored.returnedBy && stored.returnedBy.role === 'bo' ? 'BO ' + esc(F.staffName(stored.returnedBy.userId)) : 'the Inspector') + '.</div></div>';
        var isLast = step === STEPS.length - 1;
        if (isLast) fromReview = false;
        var gaps = isLast ? incomplete() : [];
        root.innerHTML = stepper + banner + (fromReview ? '<div class="alert alert-info small py-2"><i class="bi bi-pencil me-1" aria-hidden="true"></i>Editing from the review page. Make your changes, then use <strong>Save &amp; Return to Review</strong>.</div>' : '') + '<form id="stepForm" novalidate>' + RENDER[s]() +
          '<div class="d-flex justify-content-between flex-wrap gap-2 mt-3">' +
            '<div class="d-flex gap-2 flex-wrap">' + (step > 0 ? '<button type="button" class="btn btn-sm btn-outline-secondary" id="btnBack"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back</button>' : '<a class="btn btn-sm btn-outline-secondary" href="dashboard.html">Cancel</a>') +
            (mode !== 'correct' && s !== 'instructions' ? '<button type="button" class="btn btn-sm btn-outline-primary" id="btnDraft"><i class="bi bi-save me-1" aria-hidden="true"></i>Save as Draft</button>' : '') + '</div>' +
            '<div class="d-flex gap-2 flex-wrap">' + (fromReview ? '<button type="button" class="btn btn-sm btn-primary" id="btnToReview"><i class="bi bi-check2 me-1" aria-hidden="true"></i>Save &amp; Return to Review</button>' : '') +
            '<button type="submit" class="btn btn-sm ' + (isLast ? 'btn-success' : (fromReview ? 'btn-outline-primary' : 'btn-primary')) + '"' + (gaps.length ? ' disabled aria-disabled="true"' : '') + '>' + (isLast ? '<i class="bi bi-send me-1" aria-hidden="true"></i>' + (mode === 'correct' ? 'Resubmit Application' : 'Submit Application') : 'Next<i class="bi bi-arrow-right ms-1" aria-hidden="true"></i>') + '</button></div>' +
          '</div></form>';
        function rerender(el) { readStep(); render(el.id); }
        // Radio / checkbox cards highlight the chosen one; the applicant type changes the purpose list.
        root.querySelectorAll('.tl-scenario-chip input').forEach(function (inp) {
          inp.addEventListener('change', function () {
            if (inp.name === 'ptype' || inp.name === 'applyFor') return rerender(inp);
            readStep();
            root.querySelectorAll('.tl-scenario-chip').forEach(function (l) { var i = l.querySelector('input'); l.classList.toggle('active', i.checked); });
          });
        });
        // Items: ticking an item opens its sub-items; the filter only hides items that are not ticked.
        root.querySelectorAll('input[data-cat], input[data-sub]').forEach(function (cb) { cb.addEventListener('change', function () { rerender(cb); }); });
        root.querySelectorAll('#p_item_OTHER, #f_otherPurpose').forEach(function (x) { x.addEventListener('change', function () { readStep(); purposeCount(); }); });
        if ($('p_filter')) { $('p_filter').value = pFilter; $('p_filter').addEventListener('input', function () { pFilter = $('p_filter').value; filterItems(); }); filterItems(); }
        F.FIELDS.filter(function (f) { return f.toggles; }).forEach(function (f) { var el = $('f_' + f.key); if (el) el.addEventListener('change', function () { rerender(el); }); });
        root.querySelectorAll('input[data-doc]').forEach(function (el) {
          var nf = newFiles[el.getAttribute('data-doc')];
          if (nf) { try { var dt = new DataTransfer(); nf.forEach(function (x) { dt.items.add(x); }); el.files = dt.files; } catch (e) { /* ignore */ } }
        });
        App.bindDropzones(root);
        root.querySelectorAll('[data-newdoc]').forEach(function (b) {
          var k = b.getAttribute('data-newdoc'), f = newFiles[k][0];
          var url = URL.createObjectURL(f);
          if (/^image\//.test(f.type)) b.innerHTML = '<img src="' + url + '" alt="">';
          else if (/\.pdf$/i.test(f.name)) b.innerHTML = '<iframe src="' + url + '#toolbar=0&navpanes=0&scrollbar=0&view=FitH" title="" tabindex="-1" aria-hidden="true"></iframe><span class="tl-thumb-ext">PDF</span>';
          b.classList.add('has-file');
          b.addEventListener('click', function () { App.openDoc({ file: f, docType: F.docLabel(k) }); });
        });
        if ($('btnBack')) $('btnBack').addEventListener('click', function () { readStep(); step--; render(); window.scrollTo(0, 0); });
        // Edit on the review page: open that step; "Save & Return to Review" checks it and goes back.
        root.querySelectorAll('[data-goto]').forEach(function (b) {
          b.addEventListener('click', function () { readStep(); step = STEPS.indexOf(b.getAttribute('data-goto')); fromReview = true; render(); window.scrollTo(0, 0); $('main-content').focus({ preventScroll: true }); });
        });
        if ($('btnToReview')) $('btnToReview').addEventListener('click', function () {
          readStep();
          if (!validateStep()) return;
          step = STEPS.length - 1; fromReview = false; render(); window.scrollTo(0, 0); $('main-content').focus({ preventScroll: true });
        });
        if ($('btnDraft')) $('btnDraft').addEventListener('click', function () { readStep(); if (!w.circle || !w.applicantType || !F.purposesOf(w).length) { App.toast('Choose the circle, applicant type and at least one item before saving a draft.', 'danger'); return; } saveDraft(); });
        $('stepForm').addEventListener('submit', function (e) {
          e.preventDefault();
          readStep();
          if (!validateStep()) return;
          if (!isLast) { step++; render(); window.scrollTo(0, 0); $('main-content').focus({ preventScroll: true }); return; }
          if (incomplete().length) { App.toast('Complete the items listed at the top before submitting.', 'danger'); return; }
          if (!$('declare').checked) { App.fieldError($('declare'), 'Tick the declaration to submit.'); return; }
          submit();
        });
        if (focusId && $(focusId)) $(focusId).focus();
      }

      // ---------- Persist ----------
      function storeFiles(target) {
        Object.keys(newFiles).forEach(function (k) {
          var names = App.addAttachments(target.appId, F.docLabel(k), { files: newFiles[k] });
          var prev = target.docs[k];
          target.docs[k] = { file: names[0], files: names.length > 1 ? names : undefined, v: prev ? prev.v + 1 : 1, on: D.demoToday };
          delete newFiles[k];
        });
      }
      function blank() {
        return { appId: F.nextAppId(w.circle), status: ST.DRAFT, history: [], inspections: [], versions: [], brHistory: [], boHistory: [], round: 1, selectedBo: null, returnedBy: null, correction: null, assessment: null, path: [], sentBy: null, approvedBy: null,
          originalsChecks: [], originalsVerified: false, originalsVerifiedBy: null, fee: null, challan: null, challanHistory: [], br: null, firstSubmittedOn: null, submittedOn: null };
      }
      function writeBack(target) {
        ['circle', 'applicantType', 'purposes', 'prevPurposes', 'category', 'item', 'orgType', 'kind', 'licenceNo', 'businessKey', 'change', 'instructionsAck'].forEach(function (k) { target[k] = clone(w[k] == null ? null : w[k]); });
        target.form = clone(w.form);
        target.updatedOn = D.demoToday;
      }
      function persist(target) { writeBack(target); storeFiles(target); w.docs = clone(target.docs); }
      function saveDraft() {
        var target = stored;
        if (!target) {
          target = Object.assign(blank(), { docs: {} });
          D.applications.unshift(target);
          persist(target);
          F.log(target, 'Draft saved', '');
          stored = target; mode = 'draft';
        } else persist(target);
        App.save();
        App.filesReady().then(function () { App.toast('Draft saved as ' + esc(target.appId) + '. You can continue from My Applications.'); });
        history.replaceState(null, '', 'apply.html?app=' + encodeURIComponent(target.appId));
        $('pageKind').innerHTML = App.kindBadge(w) + ' <span class="tl-ref-id small ms-1">' + esc(target.appId) + '</span>';
        render();
      }
      function submit() {
        var target = stored, isNew = !target;
        if (isNew) { target = Object.assign(blank(), { docs: {} }); D.applications.unshift(target); }
        if (mode === 'correct') {
          // Keep the earlier version: record what changed in this round.
          var changedFields = [], changedDocs = [];
          if (!F.samePurposes(F.purposesOf(stored), F.purposesOf(w)) || stored.applicantType !== w.applicantType) changedFields.push({ key: 'category', old: stored.orgType, new: w.orgType });
          F.FIELDS.forEach(function (f) { if (String(stored.form[f.key] == null ? '' : stored.form[f.key]) !== String(w.form[f.key] == null ? '' : w.form[f.key])) changedFields.push({ key: f.key, old: stored.form[f.key], new: w.form[f.key] }); });
          Object.keys(newFiles).forEach(function (k) { changedDocs.push({ key: k, old: stored.docs[k] ? stored.docs[k].file : null, new: newFiles[k].map(function (x) { return x.name; }).join(', ') }); });
          target.versions.push({ round: target.round || 1, submittedOn: target.submittedOn, returnedOn: corr.on, returnedBy: corr.by + ' (' + corr.role + ')', remarks: corr.remarks, form: clone(stored.form), changedFields: changedFields, changedDocs: changedDocs });
        }
        persist(target);
        F.submit(target);
        App.save();
        App.filesReady().then(function () { window.location.href = 'application.html?app=' + encodeURIComponent(target.appId) + '&done=1'; });
      }
      render();
    })();
  </script>
</body>
</html>
