<!DOCTYPE html>
<html lang="en" data-font-size="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Pay Fee | e-Trade Licence | Government of Sikkim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../common/css/gigw-template.css">
  <link rel="stylesheet" href="../../common/css/themes.css">
  <link rel="stylesheet" href="../../common/css/components.css">
  <link rel="stylesheet" href="../../common/css/responsive.css">
  <link rel="stylesheet" href="tl-common.css?v=20261124">
</head>
<body data-theme="teal">
  <main id="main-content">
    <nav aria-label="Breadcrumb" class="mb-2"><ol class="breadcrumb small mb-0">
      <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
      <li class="breadcrumb-item"><a href="dashboard.html#applications">My Applications</a></li>
      <li class="breadcrumb-item active" aria-current="page">Pay Fee</li>
    </ol></nav>
    <h1 class="h4 fw-bold mb-1">Pay Fee</h1>
    <p class="text-muted small mb-3">Your application is approved. Generate the challan, pay it at the bank, then upload the Bank Receipt (BR) here.</p>
    <div id="brRoot" class="mx-auto" style="max-width: 820px;"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="mock-data.js?v=20261124"></script>
  <script src="tl-app.js?v=20261124"></script>
  <script src="tl-flow.js?v=20261124"></script>
  <script src="tl-view.js?v=20261124"></script>
  <script>
    (function () {
      'use strict';
      var App = window.TLApp, F = window.TLFlow, V = window.TLView, D = App.data, esc = App.esc, inr = App.inr, ST = F.ST;
      var session = App.requireSession('applicant');
      if (!session) return;
      App.shell({ type: 'applicant', active: 'applications' });
      var $ = function (id) { return document.getElementById(id); };
      var root = $('brRoot');
      var open = App.appsOf(session.scenario).filter(function (x) { return x.status === ST.PAYMENT || x.status === ST.BR_INVALID; });
      var a = App.qs('app') ? App.app(App.qs('app')) : (open.length === 1 ? open[0] : null);

      if (!a || a.businessKey !== session.scenario) {
        root.innerHTML = open.length
          ? '<div class="card border-0 shadow-xs"><div class="card-header bg-white"><h2 class="h6 fw-bold mb-0">Select the application to pay for</h2></div><ul class="list-group list-group-flush">' + open.map(function (x) {
              return '<li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2"><div><span class="tl-ref-id small">' + esc(x.appId) + '</span> ' + App.pill(x.status) + '<div class="small text-muted">' + inr(x.fee.total) + '</div></div><a class="btn btn-sm btn-primary" href="upload-br.html?app=' + encodeURIComponent(x.appId) + '">Pay Fee</a></li>';
            }).join('') + '</ul></div>'
          : '<div class="card border-0 shadow-xs"><div class="card-body text-center py-5"><span class="tl-icon-circle bg-primary-subtle text-primary mb-3"><i class="bi bi-bank" aria-hidden="true"></i></span><h2 class="h6 fw-bold">No approved application waiting for payment</h2><p class="small text-muted mb-3">The fee is shown after your application is approved.</p><a class="btn btn-sm btn-gov-primary" href="dashboard.html#applications">My Applications</a></div></div>';
        return;
      }
      if (a.status !== ST.PAYMENT && a.status !== ST.BR_INVALID) {
        root.innerHTML = '<div class="alert alert-warning">' + esc(a.appId) + ' is ' + esc(a.status.toLowerCase()) + '; the fee cannot be paid now. <a href="application.html?app=' + encodeURIComponent(a.appId) + '">Track application</a></div>';
        return;
      }
      var bank = D.config.banks[0], needO = F.needsOriginals(a) && !a.originalsVerified;

      // Step 1: challan for the fee payable. Step 2: pay at the bank and upload the BR (only once a valid challan exists).
      function render() {
        var last = a.brHistory.length ? a.brHistory[a.brHistory.length - 1] : null, ok = F.challanValid(a), c = a.challan;
        var challanBody = ok
          ? '<div class="d-flex justify-content-between align-items-start flex-wrap gap-3"><dl class="tl-dl mb-0"><dt>Challan No.</dt><dd class="font-monospace">' + esc(c.no) + '</dd><dt>Generated on</dt><dd>' + App.fmtDate(c.on) + '</dd><dt>Amount</dt><dd class="fw-bold">' + inr(c.amount) + '</dd></dl>' +
              '<a class="btn btn-sm btn-primary" href="challan.html?app=' + encodeURIComponent(a.appId) + '" target="_blank" rel="noopener"><i class="bi bi-download me-1" aria-hidden="true"></i>Download Challan<span class="visually-hidden"> (opens in a new tab)</span></a></div>'
          : (c ? '<div class="alert alert-warning small"><i class="bi bi-exclamation-triangle me-1" aria-hidden="true"></i>The fee has changed since challan <span class="font-monospace">' + esc(c.no) + '</span> (' + inr(c.amount) + ') was generated. Generate a new challan for ' + inr(a.fee.total) + '; do not pay the old one.</div>' : '<p class="small text-muted">Generate the challan for the fee payable. Download it and take it to the bank to pay.</p>') +
            '<button type="button" class="btn btn-sm btn-primary" id="btnChallan"><i class="bi bi-file-earmark-plus me-1" aria-hidden="true"></i>' + (c ? 'Generate New Challan' : 'Generate Challan') + '</button>';
        root.innerHTML =
          '<div class="card border-0 shadow-xs mb-3"><div class="card-body"><div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-2">' +
            '<div><div class="small text-muted">Application</div><div class="d-flex align-items-center gap-2 flex-wrap"><span class="tl-ref-id">' + esc(a.appId) + '</span>' + App.kindBadge(a) + App.pill(a.status) + '</div>' +
            '<div class="small text-muted mt-1">' + esc(App.appName(a)) + ' &bull; ' + esc(a.orgType) + '</div></div>' +
            '<div class="text-end"><div class="small text-muted">Amount to pay</div><div class="tl-amount">' + inr(a.fee.total) + '</div></div></div>' +
            V.feeTable(a.fee) + V.exemptions(a.fee) + '</div></div>' +
          (last && a.status === ST.BR_INVALID ? '<div class="alert alert-danger small"><i class="bi bi-x-octagon-fill me-1" aria-hidden="true"></i>Your earlier BR <strong>' + esc(last.brNo) + '</strong> was not accepted: <strong>' + esc(last.remarks) + '</strong>' +
            (last.amount < a.fee.total ? ' Pay the balance of <strong>' + inr(a.fee.total - last.amount) + '</strong> and upload the BRs again.' : ' Please upload a valid Bank Receipt.') + '</div>' : '') +
          '<div class="card border-0 shadow-xs mb-3"><div class="card-header bg-white"><h2 class="h6 fw-bold mb-0"><span class="tl-step-no" aria-hidden="true">1</span>Generate and download the challan</h2></div><div class="card-body">' + challanBody + '</div></div>' +
          '<form id="upForm" class="card border-0 shadow-xs" novalidate><div class="card-header bg-white"><h2 class="h6 fw-bold mb-0"><span class="tl-step-no" aria-hidden="true">2</span>Pay at the bank and upload the Bank Receipt</h2>' +
            '<div class="small text-muted">Pay at ' + esc(bank.name) + ', ' + esc(bank.branch) + ' (designated bank pending departmental confirmation) with the challan. ' + (needO ? 'Then bring the BR and your <strong>original documents</strong> to the department.' : 'Keep the original BR.') + '</div></div>' +
            '<fieldset class="card-body"' + (ok ? '' : ' disabled') + '><legend class="visually-hidden">Bank Receipt details</legend>' + (ok ? '' : '<p class="small text-muted"><i class="bi bi-lock me-1" aria-hidden="true"></i>Generate the challan first.</p>') + '<div class="row g-3">' +
            '<div class="col-md-6"><label for="upBrNo" class="form-label small fw-semibold">BR number <span class="text-danger" aria-hidden="true">*</span></label><input id="upBrNo" class="form-control font-monospace" placeholder="2627N-11001-04512"></div>' +
            '<div class="col-6 col-md-3"><label for="upBrDate" class="form-label small fw-semibold">BR date <span class="text-danger" aria-hidden="true">*</span></label><input id="upBrDate" type="date" class="form-control" min="' + (c ? c.on : a.fee.fixedOn) + '" max="' + D.demoToday + '"></div>' +
            '<div class="col-6 col-md-3"><label for="upAmt" class="form-label small fw-semibold">Amount paid <span class="text-danger" aria-hidden="true">*</span></label><input id="upAmt" type="number" min="1" class="form-control" value="' + a.fee.total + '"></div>' +
            '<div class="col-12">' + App.dropzone({ id: 'upScan', label: 'Scanned copy of the BR', required: true, docType: 'Bank Receipt', help: 'PDF, JPG or PNG, up to 5 MB. Keep the original BR.' }) + '</div>' +
            '<div class="col-12" id="upWarn"></div>' +
          '</div></fieldset><div class="card-footer bg-white d-flex flex-wrap gap-2">' +
            '<button type="submit" class="btn btn-sm btn-primary"' + (ok ? '' : ' disabled') + '><i class="bi bi-upload me-1" aria-hidden="true"></i>Upload Bank Receipt</button>' +
            '<a class="btn btn-sm btn-outline-secondary" href="application.html?app=' + encodeURIComponent(a.appId) + '">Cancel</a></div></form>';
        App.bindDropzones(root);
        var gen = $('btnChallan');
        if (gen) gen.addEventListener('click', function () {
          var ch = F.generateChallan(a);
          App.save();
          App.toast('Challan ' + esc(ch.no) + ' generated for ' + inr(ch.amount) + '. Download it and pay at the bank.');
          render();
          var dl = root.querySelector('a[href^="challan.html"]');
          if (dl) dl.focus();
        });
        $('upAmt').addEventListener('input', warn);
        $('upBrNo').addEventListener('input', warn);
        $('upForm').addEventListener('submit', submit);
      }
      // Warn early: amount short of the fee, or BR number already used.
      function warn() {
        var w = [], amt = +$('upAmt').value, dup = F.brDuplicate($('upBrNo').value, a.appId);
        if (amt && amt < a.fee.total) w.push('The amount is less than ' + inr(a.fee.total) + '. The office will mark the BR invalid; pay the balance first.');
        if (dup) w.push('This BR number is already used on ' + esc(dup) + '. The office will mark it invalid.');
        $('upWarn').innerHTML = w.length ? '<div class="alert alert-warning small mb-0"><i class="bi bi-exclamation-triangle me-1" aria-hidden="true"></i>' + w.join('<br>') + '</div>' : '';
      }
      function submit(e) {
        e.preventDefault();
        if (!F.challanValid(a)) { App.toast('Generate the challan first.', 'danger'); return; }
        var ok = App.fieldError($('upBrNo'), $('upBrNo').value.trim() ? '' : 'Enter the BR number.');
        ok = App.fieldError($('upBrDate'), $('upBrDate').value ? ($('upBrDate').value > D.demoToday ? 'BR date cannot be in the future.' : '') : 'Enter the BR date.') && ok;
        ok = App.fieldError($('upAmt'), +$('upAmt').value > 0 ? '' : 'Enter the amount paid.') && ok;
        ok = App.fieldError($('upScan'), App.checkFile($('upScan'), true)) && ok;
        if (!ok) { var bad = root.querySelector('.is-invalid'); if (bad) bad.focus(); return; }
        var scan = App.addAttachments(a.appId, 'Bank Receipt', $('upScan'))[0];
        a.br = { brNo: $('upBrNo').value.trim(), brDate: $('upBrDate').value, amount: Math.round(+$('upAmt').value), scan: scan, uploadedOn: D.demoToday, status: 'Uploaded', challanNo: a.challan.no };
        a.status = ST.BR_UPLOADED;
        F.log(a, 'Bank Receipt uploaded · BR ' + a.br.brNo + ' · ' + inr(a.br.amount) + ' (challan ' + a.challan.no + ')', '');
        App.notify(a.businessKey, 'Bank Receipt uploaded', 'BR ' + a.br.brNo + ' for ' + a.appId + ' is waiting for verification.' + (needO ? ' Bring the BR and original documents to the department.' : ''), a.appId);
        App.save();
        App.filesReady().then(function () {
          App.toast('Bank Receipt uploaded. The office will verify it and ' + (a.kind === 'Renewal' ? 'renew' : 'generate') + ' your licence.');
          setTimeout(function () { window.location.href = 'application.html?app=' + encodeURIComponent(a.appId); }, 1200);
        });
      }
      render();
    })();
  </script>
</body>
</html>
