<!DOCTYPE html>
<html lang="en" data-font-size="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Track application - e-Trade Licence, Urban Development Department, Government of Sikkim.">
  <title>Track Application | e-Trade Licence | Government of Sikkim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../common/css/gigw-template.css">
  <link rel="stylesheet" href="../../common/css/themes.css">
  <link rel="stylesheet" href="../../common/css/components.css">
  <link rel="stylesheet" href="../../common/css/responsive.css">
  <link rel="stylesheet" href="tl-common.css?v=20261123">
</head>
<body data-theme="teal">
  <main id="main-content">
    <nav aria-label="Breadcrumb" class="mb-2"><ol class="breadcrumb small mb-0">
      <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
      <li class="breadcrumb-item"><a href="dashboard.html#applications">My Applications</a></li>
      <li class="breadcrumb-item active" aria-current="page">Track Application</li>
    </ol></nav>
    <div id="appRoot"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="mock-data.js?v=20261123"></script>
  <script src="tl-app.js?v=20261123"></script>
  <script src="tl-flow.js?v=20261123"></script>
  <script src="tl-view.js?v=20261123"></script>
  <script>
    (function () {
      'use strict';
      var App = window.TLApp, F = window.TLFlow, V = window.TLView, esc = App.esc, inr = App.inr, ST = F.ST;
      var session = App.requireSession('applicant');
      if (!session) return;
      App.shell({ type: 'applicant', active: 'applications' });
      var root = document.getElementById('appRoot');
      var a = App.app(App.qs('app'));
      if (!a || a.businessKey !== session.scenario) { root.innerHTML = '<div class="alert alert-warning">Application not found for this business.</div><a class="btn btn-sm btn-outline-secondary" href="dashboard.html#applications">My Applications</a>'; return; }
      document.title = a.appId + ' | e-Trade Licence';

      // What the applicant should do now
      var next = '';
      if (a.status === ST.DRAFT) next = '<a class="btn btn-sm btn-primary" href="apply.html?app=' + encodeURIComponent(a.appId) + '"><i class="bi bi-pencil me-1" aria-hidden="true"></i>Continue Application</a>';
      if (a.status === ST.RETURNED) next = '<a class="btn btn-sm btn-warning" href="apply.html?app=' + encodeURIComponent(a.appId) + '"><i class="bi bi-pencil-square me-1" aria-hidden="true"></i>Correct &amp; Resubmit</a>';
      if (a.status === ST.PAYMENT || a.status === ST.BR_INVALID) next = '<a class="btn btn-sm btn-primary" href="upload-br.html?app=' + encodeURIComponent(a.appId) + '"><i class="bi bi-upload me-1" aria-hidden="true"></i>Upload Bank Receipt</a>';
      if (a.status === ST.ISSUED) next = '<a class="btn btn-sm btn-success" href="licence.html?no=' + encodeURIComponent(a.licenceNo) + '"><i class="bi bi-download me-1" aria-hidden="true"></i>Download Licence</a>';

      var msg = {
        'Draft': 'Your application is saved as a draft and has not been submitted.',
        'Submitted': a.kind === 'Renewal' ? 'Submitted with the Bank Receipt. Give the original BR at the department; the Inspector checks it and forwards the renewal to the BO.' : 'Submitted. It is now with the Inspector.',
        'Under Inspection': 'An Inspector is checking the documents and will visit the site. No appointment is needed.',
        'Returned to Applicant': 'Correction required. Edit the marked fields and documents, then resubmit.',
        'Resubmitted': 'Resubmitted. It is back with ' + esc(F.pendingWith(a).label) + '.',
        'With BO': a.kind === 'Renewal' ? 'With the BO for approval. The BO may visit the site; this is optional for renewals.' : 'With the BO for review.',
        'With Special Secretary': 'With the Special Secretary for verification.',
        'Returned to BO': 'The Special Secretary has sent it back to the BO for review.',
        'Returned to Special Secretary': 'The HOD has sent it back to the Special Secretary.',
        'With HOD': 'With the HOD (CCS / Issuing Authority) for final approval.',
        'Approved – Payment Pending': 'Approved. Pay the fee at the bank, upload the Bank Receipt and bring it with the original documents to the department' + (a.originalsVerified ? ' (originals already verified at inspection &ndash; bring only the BR)' : '') + '.',
        'BR Uploaded': 'Bank Receipt uploaded. The Inspector / BO will verify it' + (a.originalsVerified ? '.' : ' and your original documents. Bring the BR and originals to the department.'),
        'BR Invalid': 'The Bank Receipt was not accepted. See the remarks and upload a valid one.',
        'Licence Issued': 'Licence ' + esc(a.licenceNo || '') + (a.kind === 'Renewal' ? ' is renewed and' : '') + ' is ready to download.'
      }[a.status] || '';

      root.innerHTML = (App.qs('done') ? '<div class="alert alert-success small"><i class="bi bi-check-circle-fill me-1" aria-hidden="true"></i><strong>' + (a.round > 1 ? 'Resubmitted.' : 'Submitted.') + '</strong> Your Application ID is <span class="tl-ref-id">' + esc(a.appId) + '</span>. You will get an SMS and email at each stage.</div>' : '') +
        '<div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3"><div><div class="d-flex align-items-center gap-2 flex-wrap mb-1"><h1 class="h4 fw-bold mb-0">' + esc(a.appId) + '</h1>' + App.kindBadge(a) + App.pill(a.status) + '</div>' +
          '<p class="text-muted small mb-0">' + esc(App.appName(a)) + ' &bull; pending with ' + esc(F.pendingWith(a).label) + '</p></div><div class="d-flex flex-wrap gap-2">' + next + '</div></div>' +
        '<div class="card border-0 shadow-xs mb-3"><div class="card-body"><div class="mb-2">' + V.flow(a) + '</div><p class="small mb-0">' + msg + '</p></div></div>' +
        V.correction(a) +
        (a.status === ST.BR_INVALID && a.brHistory.length ? '<div class="alert alert-danger small"><i class="bi bi-x-octagon-fill me-1" aria-hidden="true"></i><strong>Bank Receipt not accepted:</strong> ' + esc(a.brHistory[a.brHistory.length - 1].remarks) + '</div>' : '') +
        '<div class="row g-3"><div class="col-xl-7">' +
          V.card('Application details', V.details(a)) +
          '<div class="card border-0 shadow-xs mb-3"><div class="card-header bg-white"><h2 class="h6 fw-bold mb-0">Documents</h2></div>' + V.documents(a) + '</div>' +
          V.card('Earlier versions', V.versions(a), 'Kept after each return and resubmission') +
        '</div><div class="col-xl-5">' +
          V.card('Summary', V.summary(a)) +
          V.card('Fee', V.fee(a, { applicant: true })) +
          (a.br || a.brHistory.length ? V.card('Bank Receipt', V.br(a)) : '') +
          V.card('Application history', V.history(a, { applicant: true }), 'Every action with user, role, date-time and remarks') +
        '</div></div>';
    })();
  </script>
</body>
</html>
