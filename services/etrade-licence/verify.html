<!DOCTYPE html>
<html lang="en" data-font-size="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Verify an e-Trade Licence issued by the Urban Development Department, Government of Sikkim.">
  <title>Verify a Licence | e-Trade Licence | Government of Sikkim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../common/css/gigw-template.css">
  <link rel="stylesheet" href="../../common/css/themes.css">
  <link rel="stylesheet" href="../../common/css/components.css">
  <link rel="stylesheet" href="tl-common.css?v=20261127">
</head>
<body data-theme="teal" class="tl-doc-page">
  <a class="gov-skip-link" href="#main-content">Skip to Main Content</a>
  <div class="tl-no-print bg-white border-bottom py-2 mb-3">
    <div class="container-xl d-flex justify-content-between align-items-center flex-wrap gap-2">
      <a href="index.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-house me-1" aria-hidden="true"></i>e-Trade Licence Home</a>
    </div>
  </div>
  <main id="main-content" tabindex="-1" class="pb-4 px-2">
    <div class="tl-doc">
      <header class="tl-doc-head"><img src="../../common/assets/images/sikkim-government-logo-dark.png" alt="Official Emblem of the Government of Sikkim">
        <div class="fw-bold mt-1">Government of Sikkim</div><div class="small">Urban Development Department</div><h1 class="tl-doc-title">Verify an e-Trade Licence</h1></header>
      <form id="vForm" class="row g-2 align-items-end mb-3" role="search" novalidate>
        <div class="col-sm-8"><label for="vRef" class="form-label small fw-semibold">Licence number</label><input id="vRef" class="form-control font-monospace" placeholder="UDD/TL/NE/2024/0003"></div>
        <div class="col-sm-4"><button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-search me-1" aria-hidden="true"></i>Verify</button></div>
      </form>
      <div id="vResult" aria-live="polite"></div>
      <p class="small text-muted text-center mt-3 mb-0 border-top pt-2"><i class="bi bi-flask me-1" aria-hidden="true"></i>Prototype verification with demonstration data.</p>
    </div>
  </main>

  <script src="mock-data.js?v=20261127"></script>
  <script src="tl-app.js?v=20261127"></script>
  <script src="tl-flow.js?v=20261127"></script>
  <script>
    (function () {
      'use strict';
      var App = window.TLApp, F = window.TLFlow, esc = App.esc;
      var input = document.getElementById('vRef'), out = document.getElementById('vResult');
      function check(ref) {
        var lic = App.licence(String(ref || '').trim().toUpperCase());
        if (!lic) { out.innerHTML = '<div class="alert alert-danger small"><i class="bi bi-x-octagon-fill me-1" aria-hidden="true"></i>No e-Trade Licence found with number <strong>' + esc(ref) + '</strong>.</div>'; return; }
        var v = F.currentVersion(lic), st = F.licenceState(lic);
        out.innerHTML = '<div class="alert ' + (st === 'Active' ? 'alert-success' : 'alert-warning') + ' small"><i class="bi ' + (st === 'Active' ? 'bi-patch-check-fill' : 'bi-exclamation-triangle-fill') + ' me-1" aria-hidden="true"></i>' +
          (st === 'Active' ? 'This is a valid e-Trade Licence.' : 'This licence has expired and is due for renewal.') + '</div>' +
          '<table class="table table-sm"><tbody>' +
          [['Licence No.', '<span class="tl-ref-id">' + esc(lic.licenceNo) + '</span>'], ['Status', App.pill(st)], ['Business / entity', esc(v.businessName)], ['Items', esc(F.categoryNames(lic)) + ' &bull; ' + esc(lic.orgType)],
            ['Premises', esc(v.premisesAddress) + ', ' + esc(v.locality)], ['Valid up to', App.fmtDate(lic.validTo)], ['Current version', 'v' + v.v + ' issued ' + App.fmtDate(v.issuedOn)], ['Circle', esc(App.circle(lic.circle).name)]]
            .map(function (r) { return '<tr><th scope="row" class="text-muted fw-semibold" style="width:38%;">' + r[0] + '</th><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody></table>';
      }
      document.getElementById('vForm').addEventListener('submit', function (e) {
        e.preventDefault();
        if (!App.fieldError(input, input.value.trim() ? '' : 'Enter the licence number.')) return;
        history.replaceState(null, '', 'verify.html?ref=' + encodeURIComponent(input.value.trim()));
        check(input.value);
      });
      if (App.qs('ref')) { input.value = App.qs('ref'); check(App.qs('ref')); }
      App.initAccessibility();
    })();
  </script>
</body>
</html>
