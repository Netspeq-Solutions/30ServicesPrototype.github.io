<!DOCTYPE html>
<html lang="en" data-font-size="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Uploaded Document | e-Trade Licence | Government of Sikkim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../common/css/gigw-template.css">
  <link rel="stylesheet" href="../../common/css/themes.css">
  <link rel="stylesheet" href="../../common/css/components.css">
  <link rel="stylesheet" href="tl-common.css?v=20261124">
</head>
<body data-theme="teal" class="tl-doc-page">
  <a class="gov-skip-link" href="#main-content">Skip to Main Content</a>
  <div class="tl-no-print bg-white border-bottom py-2 mb-3">
    <div class="container-xl d-flex justify-content-between align-items-center flex-wrap gap-2">
      <button type="button" class="btn btn-sm btn-outline-secondary" id="btnClose"><i class="bi bi-x-lg me-1" aria-hidden="true"></i>Close</button>
      <a href="#" class="btn btn-sm btn-primary d-none" id="btnDownload" download><i class="bi bi-download me-1" aria-hidden="true"></i>Download</a>
    </div>
  </div>
  <main id="main-content" tabindex="-1" class="pb-4 px-2"><div id="docRoot"></div></main>

  <script src="mock-data.js?v=20261124"></script>
  <script src="tl-app.js?v=20261124"></script>
  <script>
    (function () {
      'use strict';
      var App = window.TLApp, D = App.data, esc = App.esc;
      var root = document.getElementById('docRoot');
      document.getElementById('btnClose').addEventListener('click', function () { if (window.opener) window.close(); else history.back(); });

      var id = App.qs('id'), name = App.qs('name');
      var a = id ? D.attachments.filter(function (x) { return x.id === id; })[0] : App.attachmentFor(name);
      if (!a && !name) { root.innerHTML = '<div class="tl-doc"><div class="alert alert-warning mb-0">Document not found.</div></div>'; return; }
      a = a || { id: null, file: name, docType: App.qs('type') || 'Document', uploadedBy: '—', at: null, appId: null };
      document.title = a.file + ' | e-Trade Licence';

      function shell(body) {
        root.innerHTML = '<article class="tl-doc" aria-label="Uploaded document ' + esc(a.file) + '">' +
          '<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 border-bottom pb-2 mb-3"><div class="min-w-0"><h1 class="h6 fw-bold mb-1 text-break"><i class="bi bi-file-earmark-text me-1 text-primary" aria-hidden="true"></i>' + esc(a.file) + '</h1>' +
          '<div class="small text-muted">' + esc(a.docType) + (a.appId ? ' &bull; <span class="tl-ref-id">' + esc(a.appId) + '</span>' : '') + ' &bull; Uploaded by ' + esc(a.uploadedBy) + (a.at ? ' on ' + App.fmtDate(a.at) : '') + '</div></div></div>' + body + '</article>';
      }
      shell('<p class="small text-muted mb-0">Opening the file…</p>');
      (a.id ? App.getFile(a.id) : Promise.resolve(null)).then(function (file) {
        if (!file) { shell(App.docSample(a)); return; }
        var v = App.fileView(file, a.docType + ': ' + a.file);
        var dl = document.getElementById('btnDownload');
        dl.href = v.url; dl.setAttribute('download', a.file); dl.classList.remove('d-none');
        shell(v.html);
      });
    })();
  </script>
</body>
</html>
