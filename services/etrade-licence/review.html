<!DOCTYPE html>
<html lang="en" data-font-size="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Review Application | e-Trade Licence | Government of Sikkim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../common/css/gigw-template.css">
  <link rel="stylesheet" href="../../common/css/themes.css">
  <link rel="stylesheet" href="../../common/css/components.css">
  <link rel="stylesheet" href="../../common/css/responsive.css">
  <link rel="stylesheet" href="tl-common.css?v=20261122">
</head>
<body data-theme="teal">
  <main id="main-content">
    <nav aria-label="Breadcrumb" class="mb-2"><ol class="breadcrumb small mb-0">
      <li class="breadcrumb-item"><a href="dashboard-staff.html">Dashboard</a></li>
      <li class="breadcrumb-item"><a href="applications.html?view=mine">My Work Queue</a></li>
      <li class="breadcrumb-item active" aria-current="page">Review Application</li>
    </ol></nav>
    <div id="reviewRoot"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="mock-data.js?v=20261122"></script>
  <script src="tl-app.js?v=20261122"></script>
  <script src="tl-flow.js?v=20261122"></script>
  <script src="tl-view.js?v=20261122"></script>
  <script>
    (function () {
      'use strict';
      var App = window.TLApp, F = window.TLFlow, V = window.TLView, D = App.data, esc = App.esc, inr = App.inr, ST = F.ST;
      var session = App.requireSession('staff');
      if (!session) return;
      App.shell({ type: 'staff', active: 'mine' });
      var root = document.getElementById('reviewRoot');
      var me = session.userId, u = App.me(session);
      var a = App.app(App.qs('app'));
      if (!a || !F.visibleTo(a, me)) { root.innerHTML = '<div class="alert alert-warning">Application not found, or not visible to your account.' + (a && u.role === 'bo' ? ' A BO sees an application only after an Inspector forwards it.' : '') + '</div><a class="btn btn-sm btn-outline-secondary" href="applications.html?view=mine">My Work Queue</a>'; return; }
      document.title = a.appId + ' | Review | e-Trade Licence';
      var activeTab = 'details';

      // ---------- Action desk ----------
      function btn(id, cls, icon, label, disabled) {
        return '<button type="button" class="btn btn-sm ' + cls + '" data-act="' + id + '"' + (disabled ? ' disabled aria-disabled="true"' : '') + '><i class="bi ' + icon + '" aria-hidden="true"></i>' + label + '</button>';
      }
      function desk() {
        var can = F.canAct(a, me), s = a.status, primary = '', secondary = '', hint = '';
        if (!can) {
          return '<p class="small text-muted mb-0"><i class="bi bi-eye me-1" aria-hidden="true"></i>View only. This application is pending with <strong>' + esc(F.pendingWith(a).label) + '</strong>.</p>';
        }
        var renewal = a.kind === 'Renewal', needsNote = !renewal && !a.assessment;
        var brPr = renewal ? F.brProblem(a) : '';
        if (u.role === 'inspector' && s !== ST.BR_UPLOADED) {
          if (s === ST.SUBMITTED || s === ST.RESUBMITTED) {
            primary = btn('start', 'btn-primary', 'bi-play-circle', 'Start Verification');
            secondary = btn('return', 'btn-outline-warning', 'bi-arrow-return-left', 'Return for Correction');
            hint = 'No lock: another Inspector can also work on this application.';
          } else if (renewal) {
            primary = btn('forwardBo', 'btn-primary', 'bi-send', 'Forward to BO', !a.originalsVerified || !!brPr);
            secondary = (a.originalsVerified ? '' : btn('originals', 'btn-outline-primary', 'bi-receipt', 'Mark Original BR Received')) + btn('note', 'btn-outline-primary', 'bi-journal-plus', 'Add Inspection Note') + btn('return', 'btn-outline-warning', 'bi-arrow-return-left', 'Return for Correction');
            hint = brPr ? esc(brPr) + ' Return the renewal with the Bank Receipt marked.' : (a.originalsVerified ? 'BR in order and the original received. A site visit is optional for renewals.' : 'Check the BR against the bank record and mark the original BR as received before forwarding.');
          } else {
            primary = btn('forwardBo', 'btn-primary', 'bi-send', 'Forward to BO', needsNote);
            secondary = btn('note', 'btn-outline-primary', 'bi-journal-plus', a.assessment ? 'Add Inspection Note' : 'Add Inspection Report') + btn('return', 'btn-outline-warning', 'bi-arrow-return-left', 'Return for Correction');
            hint = needsNote ? 'Visit the site and add the inspection report with the fee assessment (licence fee + garbage fee) before forwarding.' : 'Fee assessed: ' + inr(a.assessment.fee + a.assessment.garbage) + '. Choose one of the BOs when forwarding.';
          }
        } else if (u.role === 'bo' && s !== ST.BR_UPLOADED) {
          primary = renewal ? btn('approveRenewal', 'btn-success', 'bi-check2-circle', 'Approve Renewal', !!brPr || !a.originalsVerified) : btn('forwardSs', 'btn-primary', 'bi-send', 'Forward to Special Secretary');
          secondary = (renewal && !a.originalsVerified ? btn('originals', 'btn-outline-primary', 'bi-receipt', 'Mark Original BR Received') : '') + btn('note', 'btn-outline-primary', 'bi-journal-plus', renewal ? 'Add Site Inspection Note' : 'Add Re-inspection Note') + btn('return', 'btn-outline-warning', 'bi-arrow-return-left', 'Return for Correction');
          hint = s === ST.RETURNED_BO ? 'Returned by the Special Secretary &ndash; see the remarks in the history.' : (!renewal ? 'Fee assessed: ' + inr(F.computeFee(a).total) + ' by ' + esc(a.assessment ? a.assessment.by : 'the Inspector') + '. To revise it, add a re-inspection note.' : '') + (renewal ? (brPr ? esc(brPr) + ' Return the renewal with the Bank Receipt marked.' : (!a.originalsVerified ? 'A new BR was uploaded; mark the original as received first.' : 'Site inspection is optional for renewals. On approval the applicant can download the renewed licence.')) : '');
        } else if (u.role === 'ss') {
          primary = btn('forwardHod', 'btn-primary', 'bi-send', 'Forward to HOD');
          secondary = btn('note', 'btn-outline-primary', 'bi-journal-plus', 'Add Note') + btn('editNotes', 'btn-outline-primary', 'bi-pencil', 'Edit Inspection Notes') + btn('returnBo', 'btn-outline-warning', 'bi-arrow-return-left', 'Return to BO');
          hint = s === ST.RETURNED_SS ? 'Returned by the HOD &ndash; see the remarks in the history.' : 'Add your own note (with a site visit if you made one), or edit the notes of other officers. Edited notes keep the original version in the history.';
        } else if (u.role === 'hod') {
          primary = btn('approve', 'btn-success', 'bi-check2-circle', 'Approve');
          secondary = btn('returnSs', 'btn-outline-warning', 'bi-arrow-return-left', 'Return to Special Secretary');
          hint = 'On approval, the fee assessed by the Inspector (' + inr(F.computeFee(a).total) + ') is fixed and the payment step opens for the applicant.';
        }
        if (s === ST.BR_UPLOADED) {
          var dup = F.brDuplicate(a.br.brNo, a.appId), short = a.br.amount < a.fee.total;
          var blocked = dup || short;
          primary = btn('brVerify', 'btn-success', 'bi-patch-check', 'Verify BR &amp; Generate Licence', !a.originalsVerified || blocked);
          secondary = (a.originalsVerified ? '' : btn('originals', 'btn-outline-primary', 'bi-folder-check', 'Mark Originals Verified')) + btn('brInvalid', 'btn-outline-danger', 'bi-x-octagon', 'Mark BR Invalid');
          hint = blocked ? (dup ? 'Duplicate BR number (also used on ' + esc(dup) + '). Mark it invalid.' : 'BR amount ' + inr(a.br.amount) + ' is less than ' + inr(a.fee.total) + '. Mark it invalid so the applicant pays the balance.')
            : (a.originalsVerified ? 'Originals already verified. Check the BR against the bank record, then verify.' : 'The licence is generated only after the originals are seen. Mark originals verified first.');
        }
        return '<div id="workflowActionsContainer">' + primary + (secondary ? '<div class="gov-action-subgroup">' + secondary + '</div>' : '') + '</div>' + (hint ? '<p class="small text-muted mt-2 mb-0"><i class="bi bi-info-circle me-1" aria-hidden="true"></i>' + hint + '</p>' : '');
      }

      function render() {
        var tabs = [['details', 'Application Details'], ['docs', 'Documents'], ['notes', 'Inspection Notes (' + a.inspections.length + ')'], ['history', 'History'], ['versions', 'Earlier Versions (' + (a.versions || []).length + ')']];
        var canEditNotes = u.role === 'ss' && F.canAct(a, me);
        var panes = {
          details: (a.kind !== 'New' && a.licenceNo ? '<div class="alert alert-light border small"><i class="bi bi-link-45deg me-1" aria-hidden="true"></i>Linked to licence <a class="tl-ref-id" href="licence.html?no=' + encodeURIComponent(a.licenceNo) + '" target="_blank" rel="noopener">' + esc(a.licenceNo) + '</a>' + (a.kind === 'Change' ? ' &ndash; the existing licence stays valid while this request is processed.' : '') + '</div>' : '') + V.details(a),
          docs: V.documents(a),
          notes: V.notes(a, { canEdit: canEditNotes }),
          history: V.history(a),
          versions: V.versions(a)
        };
        root.innerHTML =
          '<div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3"><div class="min-w-0"><div class="d-flex align-items-center gap-2 flex-wrap mb-1"><h1 class="h4 fw-bold mb-0">' + esc(a.appId) + '</h1>' + App.kindBadge(a.kind) + App.pill(a.status) + '</div>' +
            '<p class="text-muted small mb-0">' + esc(App.appName(a)) + ' &bull; ' + esc(a.orgType) + ' &bull; pending with ' + esc(F.pendingWith(a).label) + '</p></div>' +
            '<span class="badge bg-primary-subtle text-primary border border-primary-subtle">' + esc(u.designation) + ' &ndash; ' + esc(u.name) + '</span></div>' +
          '<div class="card border-0 shadow-xs mb-3"><div class="card-body py-2">' + V.flow(a) + '</div></div>' +
          V.correction(a) +
          '<div class="row g-3"><div class="col-xl-8 min-w-0">' +
            '<div class="card border-0 shadow-xs"><div class="card-header bg-white pb-0"><ul class="nav nav-tabs card-header-tabs flex-nowrap overflow-auto" role="tablist">' +
              tabs.map(function (t) { return '<li class="nav-item" role="presentation"><button class="nav-link small text-nowrap' + (t[0] === activeTab ? ' active' : '') + '" id="tab-' + t[0] + '" data-bs-toggle="tab" data-bs-target="#pane-' + t[0] + '" type="button" role="tab" aria-controls="pane-' + t[0] + '" aria-selected="' + (t[0] === activeTab) + '" data-tab="' + t[0] + '">' + esc(t[1]) + '</button></li>'; }).join('') +
            '</ul></div><div class="card-body tab-content">' +
              tabs.map(function (t) { return '<div class="tab-pane fade' + (t[0] === activeTab ? ' show active' : '') + '" id="pane-' + t[0] + '" role="tabpanel" aria-labelledby="tab-' + t[0] + '" tabindex="0">' + (t[0] === 'docs' ? '<div class="mx-n3">' + panes.docs + '</div>' : panes[t[0]]) + '</div>'; }).join('') +
            '</div></div>' +
          '</div><div class="col-xl-4 order-first order-xl-last"><div class="tl-action-rail">' +
            '<div class="gov-workflow-panel mb-3"><div class="gov-workflow-panel-header"><h2 class="h6 fw-bold mb-0">Verification Decision</h2><div class="small text-muted">Remarks are mandatory on every return. No outright rejection.</div></div>' + desk() + '</div>' +
            V.card('Summary', V.summary(a)) +
            V.card('Fee', V.fee(a)) +
            (a.br || a.brHistory.length ? V.card('Bank Receipt', V.br(a)) : '') +
          '</div></div></div>';
        root.querySelectorAll('[data-tab]').forEach(function (b) { b.addEventListener('shown.bs.tab', function () { activeTab = b.getAttribute('data-tab'); }); });
        root.querySelectorAll('[data-act]').forEach(function (b) { b.addEventListener('click', function () { open(b.getAttribute('data-act')); }); });
        root.querySelectorAll('[data-edit-note]').forEach(function (b) { b.addEventListener('click', function () { editNote(b.getAttribute('data-edit-note')); }); });
      }

      // ---------- Run an action and refresh ----------
      function run(action, payload) {
        try {
          var msg = F.act(a, action, payload);
          App.save();
          App.filesReady().then(function () { App.toast(esc(msg)); });
          render();
          window.scrollTo(0, 0);
          return true;
        } catch (err) { App.toast(esc(err.message), 'danger'); return false; }
      }
      function remarksField(required, placeholder) {
        return '<label for="mRemarks" class="form-label fw-semibold">Remarks' + (required ? ' <span class="text-danger" aria-hidden="true">*</span>' : ' (optional)') + '</label><textarea id="mRemarks" class="form-control form-control-sm" rows="3" placeholder="' + esc(placeholder || '') + '"></textarea>';
      }
      function readRemarks(el, required) {
        var r = el.querySelector('#mRemarks'), v = r.value.trim();
        return App.fieldError(r, required && v.length < 5 ? 'Enter remarks (at least 5 characters).' : '') ? v : null;
      }
      function simple(action, title, okLabel, okClass, required, body, placeholder) {
        App.modal({ title: title, ok: okLabel, okClass: okClass, body: (body || '') + remarksField(required, placeholder), onOk: function (el) {
          var r = readRemarks(el, required);
          if (r === null) return false;
          return run(action, { remarks: r });
        } });
      }

      function open(act) {
        if (act === 'start') return run('start', {});
        if (act === 'forwardSs') return simple('forwardSs', 'Forward to Special Secretary', 'Forward', 'btn-primary', false, '<p>Forward ' + esc(a.appId) + ' to the Special Secretary for verification.</p>', 'Recommendation');
        if (act === 'forwardHod') return simple('forwardHod', 'Forward to HOD', 'Forward', 'btn-primary', false, '<p>Forward to the HOD. Any one of the CCS or Issuing Authorities can give final approval.</p>');
        if (act === 'returnBo') return simple('returnBo', 'Return to BO', 'Return to BO', 'btn-warning', true, '<p>Return to BO <strong>' + esc(F.staffName(a.selectedBo)) + '</strong>. The BO can then forward again or return to the applicant.</p>', 'What should the BO check?');
        if (act === 'returnSs') return simple('returnSs', 'Return to Special Secretary', 'Return', 'btn-warning', true, '<p>Return to the Special Secretary, who can forward to HOD again or return to the BO.</p>', 'What should be checked?');
        if (act === 'originals') return a.kind === 'Renewal' ? simple('originals', 'Original Bank Receipt received', 'Mark Received', 'btn-primary', false, '<p>Confirm that the applicant has given the original Bank Receipt <strong>' + esc(a.br ? a.br.brNo : '') + '</strong> at the department.</p>') : simple('originals', 'Mark original documents verified', 'Mark Verified', 'btn-primary', false, '<p>Confirm that you have seen the original documents brought by the applicant.</p>');
        if (act === 'approve') {
          var fee = F.computeFee(a);
          var body = '<div class="alert alert-light border"><div class="fw-semibold mb-1">Fee to be fixed now</div><table class="table table-sm mb-1"><tbody><tr><td>' + esc(fee.kind) + ' fee</td><td class="text-end">' + inr(fee.base) + '</td></tr>' +
            '<tr><td>Garbage fee</td><td class="text-end">' + inr(fee.garbage) + '</td></tr><tr><th>Total</th><th class="text-end">' + inr(fee.total) + '</th></tr></tbody></table><div class="text-muted">Assessed by ' + esc(fee.assessedBy) + ' (' + esc(fee.assessedRole) + ') on ' + App.fmtDate(fee.assessedOn) + '.' +
            (a.kind === 'New' ? ' This becomes the renewal amount of the licence; the department can revise it later.' : '') + '</div></div>';
          return simple('approve', 'Approve application', 'Approve', 'btn-success', false, body);
        }
        if (act === 'approveRenewal') {
          return simple('approveRenewal', 'Approve renewal', 'Approve Renewal', 'btn-success', false,
            '<ul class="mb-2"><li>BR ' + esc(a.br.brNo) + ' dated ' + App.fmtDate(a.br.brDate) + ' &ndash; ' + inr(a.br.amount) + ' (amount due ' + inr(a.fee.total) + ')</li><li>' + esc(a.originalsVerifiedBy) + '</li>' +
            '<li>Same licence number; new validity to the next 31 March. The applicant can download the renewed licence straight away.</li></ul>' + (a.inspections.some(function (n) { return n.role === 'BO'; }) ? '' : '<p class="text-muted">No site inspection note by the BO &ndash; optional for renewals.</p>'));
        }
        if (act === 'return') return returnModal();
        if (act === 'forwardBo') return forwardBoModal();
        if (act === 'note') return noteModal();
        if (act === 'editNotes') { activeTab = 'notes'; render(); document.getElementById('pane-notes').scrollIntoView({ behavior: 'smooth' }); return; }
        if (act === 'brInvalid') {
          var sugg = [];
          var dup = F.brDuplicate(a.br.brNo, a.appId);
          if (a.br.amount < a.fee.total) sugg.push('BR amount ' + inr(a.br.amount) + ' is less than the fee payable ' + inr(a.fee.total) + '. Pay the balance of ' + inr(a.fee.total - a.br.amount) + ' and upload again.');
          if (dup) sugg.push('BR number ' + a.br.brNo + ' is already used on ' + dup + '. Upload the correct Bank Receipt.');
          sugg.push('BR scan is not readable. Upload a clear copy.');
          sugg.push('BR not found in the bank record. Check the BR number and date.');
          App.modal({ title: 'Mark Bank Receipt invalid', ok: 'Mark Invalid', okClass: 'btn-danger', body: '<p>The applicant will be asked to upload a valid BR.</p><div class="mb-2 d-flex flex-wrap gap-1">' + sugg.map(function (t, i) { return '<button type="button" class="btn btn-sm btn-outline-secondary" data-sugg="' + i + '">' + esc(t.split('.')[0]) + '</button>'; }).join('') + '</div>' + remarksField(true),
            onShow: function (el) { el.querySelectorAll('[data-sugg]').forEach(function (b) { b.addEventListener('click', function () { el.querySelector('#mRemarks').value = sugg[+b.getAttribute('data-sugg')]; }); }); },
            onOk: function (el) { var r = readRemarks(el, true); if (r === null) return false; return run('brInvalid', { remarks: r }); } });
          return;
        }
        if (act === 'brVerify') {
          return simple('brVerify', 'Verify BR and generate licence', 'Verify &amp; Generate', 'btn-success', false,
            '<ul class="mb-2"><li>BR ' + esc(a.br.brNo) + ' dated ' + App.fmtDate(a.br.brDate) + ' &ndash; ' + inr(a.br.amount) + ' (fee ' + inr(a.fee.total) + ')</li><li>Originals: ' + esc(a.originalsVerifiedBy) + '</li><li>' +
            (a.kind === 'New' ? 'A new licence number is generated, valid to ' + App.fmtDate(F.fyEnd(D.demoToday)) + '.' : (a.kind === 'Renewal' ? 'Same licence number; new validity to the next 31 March.' : 'A new version is generated with the same licence number and validity; the old version is marked Superseded.')) + '</li></ul>');
        }
      }

      function returnModal() {
        var keys = F.docKeys(a).concat(a.kind === 'Renewal' && a.br ? ['br'] : []);
        var editableFields = a.kind === 'Change' ? F.changeFields(a) : (a.kind === 'Renewal' ? F.renewalFields(a) : F.fieldsFor(a).map(function (f) { return f.key; }));
        var fieldOpts = (a.kind === 'New' ? [['circle', 'Circle (wrong circle chosen)'], ['category', F.fieldLabel('category')]] : []).concat(editableFields.map(function (k) { return [k, F.fieldLabel(k, F.typeOf(a))]; }));
        function boxes(prefix, list) {
          return list.map(function (o) { return '<div class="form-check"><input class="form-check-input" type="checkbox" id="' + prefix + o[0] + '" value="' + o[0] + '" data-' + prefix + '><label class="form-check-label" for="' + prefix + o[0] + '">' + esc(o[1]) + '</label></div>'; }).join('');
        }
        var returnTo = u.role === 'bo' ? 'you (BO ' + esc(u.name) + ')' : 'the Inspector';
        App.modal({ title: 'Return for correction', ok: 'Return to Applicant', okClass: 'btn-warning', size: 'lg',
          body: '<p>The applicant edits only the fields and documents you mark, then resubmits. It comes back to ' + returnTo + '.</p>' + remarksField(true, 'What must the applicant correct?') +
            '<div class="row g-3 mt-1"><div class="col-md-6"><fieldset><legend class="fw-semibold small">Fields to correct</legend><div style="max-height:220px;overflow:auto;">' + boxes('rf', fieldOpts) + '</div></fieldset></div>' +
            '<div class="col-md-6"><fieldset><legend class="fw-semibold small">Documents to upload again</legend><div style="max-height:220px;overflow:auto;">' + boxes('rd', keys.map(function (k) { return [k, F.docLabel(k)]; })) + '</div></fieldset></div></div>' +
            '<p class="text-muted mt-2 mb-0">If nothing is marked, the applicant may edit the whole form.</p>',
          onOk: function (el) {
            var r = readRemarks(el, true);
            if (r === null) return false;
            var fields = Array.prototype.slice.call(el.querySelectorAll('[data-rf]:checked')).map(function (x) { return x.value; });
            var docs = Array.prototype.slice.call(el.querySelectorAll('[data-rd]:checked')).map(function (x) { return x.value; });
            return run('return', { remarks: r, fields: fields, docs: docs });
          } });
      }
      function forwardBoModal() {
        var bos = Object.keys(D.staff).filter(function (k) { return D.staff[k].role === 'bo' && D.staff[k].circle === a.circle; });
        App.modal({ title: 'Forward to BO', ok: 'Forward', okClass: 'btn-primary',
          body: '<fieldset><legend class="fw-semibold small">Select the BO <span class="text-danger" aria-hidden="true">*</span></legend>' + bos.map(function (k, i) {
              var b = D.staff[k];
              return '<div class="form-check mb-1"><input class="form-check-input" type="radio" name="mBo" id="mBo' + i + '" value="' + k + '"><label class="form-check-label" for="mBo' + i + '"><strong>' + esc(b.name) + '</strong> <span class="text-muted">&ndash; ' + esc(b.note || 'BO') + '</span></label></div>';
            }).join('') + '<div class="invalid-feedback d-block" id="mBoErr"></div></fieldset>' +
            (a.category === 'PHARMA' ? '<p class="text-muted">Pharma case. You may choose either BO; there is no automatic routing.</p>' : '') + remarksField(false, 'Inspection summary'),
          onOk: function (el) {
            var c = el.querySelector('input[name="mBo"]:checked');
            el.querySelector('#mBoErr').textContent = c ? '' : 'Select a BO.';
            if (!c) return false;
            return run('forwardBo', { boId: c.value, remarks: el.querySelector('#mRemarks').value.trim() });
          } });
      }
      function noteModal() {
        // The Inspector assesses the fee (licence / change fee + garbage fee) in the inspection report.
        var assess = (u.role === 'inspector' || u.role === 'bo') && a.kind !== 'Renewal', as = a.assessment || {};
        var feeBox = assess ? '<div class="col-12"><fieldset class="border rounded p-3"><legend class="float-none w-auto px-1 mb-0 small fw-semibold">Fee assessment' + (a.assessment ? ' <span class="text-muted fw-normal">(revise if needed)</span>' : '') + '</legend><div class="row g-3">' +
            '<div class="col-sm-4"><label for="mFee" class="form-label fw-semibold">' + (a.kind === 'Change' ? 'Change fee' : 'Licence fee') + ' (₹) <span class="text-danger" aria-hidden="true">*</span></label><input type="number" min="0" id="mFee" class="form-control form-control-sm" value="' + esc(as.fee == null ? '' : as.fee) + '"></div>' +
            '<div class="col-sm-4"><label for="mGarbage" class="form-label fw-semibold">Garbage fee (₹) <span class="text-danger" aria-hidden="true">*</span></label><input type="number" min="0" id="mGarbage" class="form-control form-control-sm" value="' + esc(as.garbage == null ? '' : as.garbage) + '"></div>' +
            '<div class="col-sm-4"><div class="form-label fw-semibold">Total payable</div><div class="tl-amount" id="mTotal">' + inr((as.fee || 0) + (as.garbage || 0)) + '</div></div></div>' +
            (a.assessment ? '<p class="text-muted mb-0 mt-2">Current: ' + inr(as.fee + as.garbage) + ' by ' + esc(as.by) + ' (' + esc(as.role || 'Inspector') + '). Leave it as it is, or enter the revised amounts.</p>' : '') + '<p class="text-muted mb-0 mt-2">Work out the fee as per the UDD notification for ' + esc(a.orgType) + '. It is fixed when the HOD approves' + (a.kind === 'New' ? ' and becomes the renewal amount of the licence.' : '.') + '</p></fieldset></div>' : '';
        var isSS = u.role === 'ss';
        App.modal({ title: isSS ? 'Add Special Secretary note' : assess && u.role === 'inspector' ? 'Add inspection report' : assess ? 'Add re-inspection note' : (u.role === 'bo' ? (a.kind === 'Renewal' ? 'Add site inspection note' : 'Add re-inspection note') : 'Add inspection note'), ok: 'Save', okClass: 'btn-primary', size: 'lg',
          body: '<div class="row g-3"><div class="col-md-4"><label for="mVisit" class="form-label fw-semibold">Date of site visit' + (isSS ? ' <span class="text-muted fw-normal">(if visited)</span>' : ' <span class="text-danger" aria-hidden="true">*</span>') + '</label><input type="date" id="mVisit" class="form-control form-control-sm" max="' + D.demoToday + '" value="' + (isSS ? '' : D.demoToday) + '"></div>' +
            '<div class="col-12"><label for="mNotes" class="form-label fw-semibold">' + (isSS ? 'Notes' : 'Inspection notes') + ' <span class="text-danger" aria-hidden="true">*</span></label><textarea id="mNotes" class="form-control form-control-sm" rows="4" placeholder="What was seen at the site"></textarea></div>' +
            '<div class="col-12">' + App.dropzone({ id: 'mFiles', label: 'Photos / documents (optional)', multiple: true, docType: 'Inspection photo / document' }) + '</div>' + feeBox +
            (isSS ? '' : a.originalsVerified ? '<div class="col-12 text-success"><i class="bi bi-check-circle-fill me-1" aria-hidden="true"></i>Originals already verified: ' + esc(a.originalsVerifiedBy) + '</div>' :
              '<div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="mOrig"><label class="form-check-label" for="mOrig">Original documents seen and collected during this inspection (the applicant need not bring them later)</label></div></div>') + '</div>',
          onShow: function (el) {
            App.bindDropzones(el);
            if (assess) ['#mFee', '#mGarbage'].forEach(function (q) { el.querySelector(q).addEventListener('input', function () { el.querySelector('#mTotal').textContent = inr((+el.querySelector('#mFee').value || 0) + (+el.querySelector('#mGarbage').value || 0)); }); });
          },
          onOk: function (el) {
            var n = el.querySelector('#mNotes'), d = el.querySelector('#mVisit'), f = el.querySelector('#mFiles');
            var ok = App.fieldError(n, n.value.trim().length < 5 ? (isSS ? 'Enter the notes.' : 'Enter the inspection notes.') : '');
            ok = App.fieldError(d, !d.value ? (isSS ? '' : 'Enter the visit date.') : (d.value > D.demoToday ? 'The visit date cannot be in the future.' : '')) && ok;
            ok = App.fieldError(f, App.checkFile(f, false)) && ok;
            var fe = el.querySelector('#mFee'), ga = el.querySelector('#mGarbage');
            if (assess) {
              ok = App.fieldError(fe, fe.value === '' || +fe.value <= 0 ? 'Enter the fee assessed.' : '') && ok;
              ok = App.fieldError(ga, ga.value === '' || +ga.value < 0 ? 'Enter the garbage fee (0 if none).' : '') && ok;
            }
            if (!ok) return false;
            var files = App.addAttachments(a.appId, 'Inspection photo / document', f);
            var o = el.querySelector('#mOrig');
            activeTab = 'notes';
            return run('note', { notes: n.value.trim(), visitDate: d.value, files: files, originals: !!(o && o.checked), assess: assess ? { fee: Math.round(+fe.value), garbage: Math.round(+ga.value) } : null });
          } });
      }
      function editNote(id) {
        var n = a.inspections.filter(function (x) { return x.id === id; })[0];
        App.modal({ title: 'Edit inspection note', ok: 'Save Edited Note', okClass: 'btn-primary', size: 'lg',
          body: '<p class="text-muted">Note by ' + esc(n.byName) + ' (' + esc(n.role) + '), ' + (n.visitDate ? 'site visit ' + App.fmtDate(n.visitDate) : 'added ' + App.fmtStamp(n.at)) + '. The original text is kept and shown in the history.</p>' +
            '<label for="mNotes" class="form-label fw-semibold">Notes <span class="text-danger" aria-hidden="true">*</span></label><textarea id="mNotes" class="form-control form-control-sm mb-3" rows="4">' + esc(n.notes) + '</textarea>' + remarksField(false, 'Reason for the edit'),
          onOk: function (el) {
            var t = el.querySelector('#mNotes');
            if (!App.fieldError(t, t.value.trim().length < 5 ? 'Enter the notes.' : (t.value.trim() === n.notes ? 'No change made to the note.' : ''))) return false;
            activeTab = 'notes';
            return run('editNote', { noteId: id, notes: t.value.trim(), remarks: el.querySelector('#mRemarks').value.trim() });
          } });
      }
      render();
    })();
  </script>
</body>
</html>
