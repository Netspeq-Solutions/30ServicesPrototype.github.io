<!DOCTYPE html>
<html lang="en" data-font-size="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Challan | e-Trade Licence | Government of Sikkim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../common/css/gigw-template.css">
  <link rel="stylesheet" href="../../common/css/themes.css">
  <link rel="stylesheet" href="../../common/css/components.css">
  <link rel="stylesheet" href="tl-common.css?v=20261127">
</head>
<body data-theme="teal" class="tl-doc-page">
  <a class="gov-skip-link" href="#main-content">Skip to Main Content</a>
  <div class="tl-no-print bg-white border-bottom py-2 mb-3">
    <div class="container-xl d-flex justify-content-between align-items-center flex-wrap gap-2">
      <a href="#" class="btn btn-sm btn-outline-secondary" id="btnBack"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back</a>
      <button type="button" class="btn btn-sm btn-primary" onclick="window.print()"><i class="bi bi-printer me-1" aria-hidden="true"></i>Print / Save as PDF</button>
    </div>
  </div>
  <main id="main-content" tabindex="-1" class="pb-4 px-2"><div id="docRoot"></div></main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="mock-data.js?v=20261127"></script>
  <script src="tl-app.js?v=20261127"></script>
  <script src="tl-flow.js?v=20261127"></script>
  <script>
    (function () {
      'use strict';
      var App = window.TLApp, F = window.TLFlow, D = App.data, esc = App.esc, inr = App.inr;
      var s = App.getSession();
      var a = App.app(App.qs('app'));
      var back = document.getElementById('btnBack');
      back.href = s && s.type === 'staff' ? 'review.html?app=' + encodeURIComponent(App.qs('app') || '') : 'upload-br.html?app=' + encodeURIComponent(App.qs('app') || '');
      back.addEventListener('click', function (e) { if (document.referrer && document.referrer.indexOf(location.host) !== -1 && history.length > 1) { e.preventDefault(); history.back(); } });
      var root = document.getElementById('docRoot');
      // The applicant sees only their own challan; officers see their circle.
      var allowed = a && s && ((s.type === 'applicant' && a.businessKey === s.scenario) || (s.type === 'staff' && App.me(s) && App.me(s).circle === a.circle));
      if (!allowed || !a.challan) { root.innerHTML = '<div class="tl-doc"><div class="alert alert-warning mb-0">' + (allowed ? 'No challan has been generated for this application yet.' : 'Challan not found for this login.') + '</div></div>'; return; }
      var c = a.challan, ok = F.challanValid(a), bank = D.config.banks[0];
      var lines = F.feeLines(a.fee).filter(function (l) { return !l.exempt; });
      var what = { New: F.isOldRenewal(a) ? 'Renewal of an old licence (new application)' : 'New licence', Renewal: 'Renewal of licence', Change: 'Change request' }[a.kind];
      document.title = c.no + ' | Challan | e-Trade Licence';

      function copy(label) {
        return '<section class="tl-challan-copy" aria-label="' + esc(label) + '">' +
          '<div class="d-flex justify-content-between align-items-start gap-2 mb-2"><div class="small fw-semibold text-uppercase">' + esc(label) + '</div><div class="small text-muted">Generated ' + App.fmtDate(c.on) + '</div></div>' +
          '<header class="text-center mb-2"><img src="../../common/assets/images/sikkim-government-logo-dark.png" alt="Official Emblem of the Government of Sikkim" class="tl-challan-emblem">' +
            '<div class="fw-bold">GOVERNMENT OF SIKKIM</div><div class="fw-bold small">URBAN DEVELOPMENT DEPARTMENT</div><h1 class="tl-doc-title h5 mt-1 mb-0">CHALLAN &ndash; e-TRADE LICENCE FEE</h1></header>' +
          '<table class="table table-sm table-bordered small mb-2"><caption class="visually-hidden">Challan details</caption><tbody>' +
            [['Challan No.', '<span class="font-monospace fw-semibold">' + esc(c.no) + '</span>'], ['Application ID', '<span class="font-monospace">' + esc(a.appId) + '</span>'],
              a.licenceNo ? ['Licence No.', '<span class="font-monospace">' + esc(a.licenceNo) + '</span>'] : null,
              ['Deposited by', esc(a.form.applicantName) + (App.appName(a) ? ' &bull; ' + esc(App.appName(a)) : '')], ['Purpose of payment', esc(what) + ' &ndash; ' + esc(a.orgType)],
              ['Head of account', esc(D.config.headOfAccount)], ['Bank', esc(bank.name) + ', ' + esc(bank.branch) + ' <span class="text-muted">(pending departmental confirmation)</span>']]
              .filter(Boolean).map(function (r) { return '<tr><th scope="row" class="fw-semibold text-muted" style="width:34%;">' + r[0] + '</th><td>' + r[1] + '</td></tr>'; }).join('') +
          '</tbody></table>' +
          '<table class="table table-sm table-bordered small mb-2"><caption class="visually-hidden">Amount payable</caption><thead><tr><th scope="col">Charge</th><th scope="col" class="text-end" style="width:30%;">Amount</th></tr></thead><tbody>' +
            lines.map(function (l) { return '<tr><td>' + esc(l.label) + '</td><td class="text-end">' + inr(l.amount) + '</td></tr>'; }).join('') +
          '</tbody><tfoot><tr><th scope="row">Total</th><th class="text-end">' + inr(c.amount) + '</th></tr></tfoot></table>' +
          '<p class="small mb-2">Rupees <strong>' + esc(App.amountWords(c.amount)) + ' only</strong>.</p>' +
          '<div class="d-flex justify-content-between align-items-end flex-wrap gap-3 small mt-3"><div class="text-muted">Valid for this amount only. If the fee changes, generate a new challan.</div><div class="text-center"><div class="tl-sign-space"></div>Bank seal &amp; signature<br>BR No. ____________</div></div></section>';
      }
      root.innerHTML = '<article class="tl-doc tl-challan" aria-label="Challan ' + esc(c.no) + '">' + (ok ? '' : '<div class="tl-doc-watermark" aria-hidden="true">SUPERSEDED</div>') +
        (ok ? '' : '<div class="alert alert-danger py-2 small tl-no-print"><strong>Superseded.</strong> The fee changed after this challan was generated. Do not pay it; generate a new challan.</div>') +
        copy('Applicant copy') + '<div class="tl-challan-cut" aria-hidden="true"><span>cut here</span></div>' + copy('Bank copy') +
        '<p class="small text-muted text-center mt-3 mb-0 border-top pt-2"><i class="bi bi-flask me-1" aria-hidden="true"></i>Prototype document with demonstration data &ndash; not valid for any official purpose.</p></article>';
    })();
  </script>
</body>
</html>
