<!DOCTYPE html>
<html lang="en" data-font-size="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Configuration | Online Ground Rent Payment System | Government of Sikkim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../common/css/gigw-template.css">
  <link rel="stylesheet" href="../../common/css/themes.css">
  <link rel="stylesheet" href="../../common/css/components.css">
  <link rel="stylesheet" href="../../common/css/responsive.css">
  <link rel="stylesheet" href="gr-common.css">
  <style>.gr-cfg-tabs { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; } .gr-cfg-tabs .nav-link { white-space: nowrap; min-height: 44px; }</style>
</head>
<body data-theme="teal">
  <main id="main-content">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
      <div><h1 class="h4 fw-bold mb-1">Configuration</h1><p class="text-muted small mb-0" id="cfgSub">Rates and rules live in effective-dated tables, so a new notification is entered as a new row. Old rows are never edited.</p></div>
      <span id="modePill"></span>
    </div>
    <ul class="nav nav-tabs gr-cfg-tabs mb-3" role="tablist" id="cfgTabs"></ul>
    <div id="cfgPane"></div>
  </main>

  <div class="modal fade" id="cfgModal" tabindex="-1" aria-labelledby="cfgModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable"><form class="modal-content" id="cfgForm" novalidate>
      <div class="modal-header"><h2 class="modal-title h6 fw-bold" id="cfgModalLabel">Edit</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body" id="cfgBody"></div>
      <div class="modal-footer"><button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-sm btn-primary" id="cfgSubmit">Save</button></div>
    </form></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="mock-data.js"></script>
  <script src="dues-engine.js"></script>
  <script src="gr-app.js"></script>
  <script>
    (function () {
      'use strict';
      var App = window.GRApp, T = window.GRDues, D = App.data, esc = App.esc, inr = App.inr;
      var session = App.requireSession('staff', 'configView');
      if (!session) return;
      App.shell({ type: 'staff', active: 'config' });
      var edit = App.can('configEdit');
      var $ = function (id) { return document.getElementById(id); };
      $('modePill').innerHTML = edit ? App.pill('paid', 'System Admin – can edit') : App.pill('info', 'View only');

      // ---------- Modal ----------
      var modal = new bootstrap.Modal($('cfgModal'));
      var handler = null;
      function open(title, body, label, fn, tone) {
        $('cfgModalLabel').innerHTML = title; $('cfgBody').innerHTML = body; $('cfgSubmit').textContent = label;
        $('cfgSubmit').className = 'btn btn-sm btn-' + (tone || 'primary'); handler = fn; modal.show();
      }
      $('cfgForm').addEventListener('submit', function (e) { e.preventDefault(); if (handler && handler() !== false) { modal.hide(); App.save(); render(); } });
      function v(id) { return ($(id) && $(id).value || '').trim(); }
      function need(id, msg) { return App.fieldError($(id), v(id) ? '' : msg); }
      var reasonField = '<div class="mt-2"><label for="cReason" class="form-label small fw-semibold">Reason <span class="text-danger">*</span></label><input id="cReason" class="form-control form-control-sm"></div>';
      function btn(label, attr, tone) { return edit ? '<button type="button" class="btn btn-sm btn-' + (tone || 'outline-primary') + '" ' + attr + '>' + label + '</button>' : ''; }

      var TABS = [['ulbs', 'Districts & ULBs'], ['wards', 'Wards & Localities'], ['rates', 'Rates & Surcharge'], ['rules', 'Rules & Lists'], ['users', 'Users & Roles']];
      // HQ sees only the masters and rates; global rules and users are System Admin business.
      if (session.role === 'hq') TABS = TABS.slice(0, 3);
      // The District → ULB mapping is a System Admin master; others just pick a ULB.
      if (session.role !== 'sysAdmin') TABS = TABS.filter(function (t) { return t[0] !== 'ulbs'; });
      var tab = (location.hash || '#' + TABS[0][0]).slice(1);
      if (!TABS.some(function (t) { return t[0] === tab; })) tab = TABS[0][0];
      var wardUlb = App.staffScope(session) || (App.defaultUlb() === 'ALL' ? D.config.ulbs[0].code : App.defaultUlb()), rateTab = 'rent';

      function card(title, body, action) {
        return '<div class="card border-0 shadow-xs mb-3"><div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2"><h2 class="h6 fw-bold mb-0">' + title + '</h2>' + (action || '') + '</div>' + body + '</div>';
      }
      function table(head, rows, caption) {
        return '<div class="table-responsive"><table class="table gov-table-compact mb-0"><caption class="visually-hidden">' + caption + '</caption><thead><tr>' + head.map(function (h) { return '<th scope="col"' + (h.end ? ' class="text-end"' : '') + '>' + (h.t || h) + '</th>'; }).join('') + '</tr></thead><tbody>' + (rows || '<tr><td colspan="' + head.length + '" class="text-center text-muted py-3">None.</td></tr>') + '</tbody></table></div>';
      }

      // ================= Masters 1: District → ULB → Type =================
      function typeName(code) { var c = D.config.rateCategories.filter(function (x) { return x.code === code; })[0]; return c ? c.name : code; }
      function wardsNamed(u) { return App.wardsOf(u.code).filter(function (w) { return (w.localities || []).length; }).length; }
      function paneUlbs() {
        var rows = '';
        D.config.districts.forEach(function (dist) {
          var list = D.config.ulbs.filter(function (u) { return u.district === dist; });
          list.forEach(function (u, i) {
            var p = u.migrationStatus === 'Live' ? App.pill('paid', 'Live') : u.migrationStatus === 'Data received' ? App.pill('pending', 'Data received') : App.pill('closed', 'Not live');
            var wards = App.wardsOf(u.code).length;
            rows += '<tr>' + (i === 0 ? '<th scope="rowgroup" rowspan="' + list.length + '" class="fw-bold small align-top">' + esc(dist) + '</th>' : '') +
              '<td class="fw-semibold small">' + esc(u.name) + '</td><td class="small">' + esc(typeName(u.category)) + '</td>' +
              '<td class="text-end small">' + wards + (u.category === 'ONA' ? ' area' + (wards > 1 ? 's' : '') : '') + '<div class="text-muted">' + wardsNamed(u) + ' with localities</div></td><td>' + p + '</td>' +
              '<td class="text-end text-nowrap"><div class="d-inline-flex gap-1"><button type="button" class="btn btn-sm btn-outline-secondary" data-goward="' + u.code + '">Wards</button>' + btn('Edit', 'data-ulb="' + u.code + '"') + '</div></td></tr>';
          });
        });
        return card('Districts &amp; ULBs', table(['District', 'Municipality / ULB', 'Type', { t: 'Wards', end: true }, 'Status', { t: 'Action', end: true }], rows, 'Districts and ULBs') +
            '<div class="card-footer bg-white small text-muted">The type decides the rent rate (Rates &amp; Surcharge tab). Adding a ULB creates its wards as Ward 1 … Ward N (a bazaar usually has one area); name them and add localities in the Wards &amp; Localities tab.</div>',
            btn('<i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Add ULB', 'id="btnAddUlb"', 'primary'));
      }
      function ulbForm(u) {
        var isNew = !u;
        u = u || { code: '', name: '', category: 'NP', district: D.config.districts[0], wardCount: 5, cutOffDate: '', goLiveFy: '', migrationStatus: 'Not started', active: false };
        var locked = u.migrationStatus === 'Live';
        var opt = function (list, sel) { return list.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === sel ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); };
        open(isNew ? 'Add ULB' : 'Edit ' + esc(u.name),
          '<div class="row g-2"><div class="col-md-6"><label for="uDist" class="form-label small fw-semibold">District <span class="text-danger">*</span></label><select id="uDist" class="form-select form-select-sm">' + opt(D.config.districts.map(function (d) { return [d, d]; }), u.district) + '</select></div>' +
          '<div class="col-md-6"><label for="uCat" class="form-label small fw-semibold">Type <span class="text-danger">*</span></label><select id="uCat" class="form-select form-select-sm">' + opt(D.config.rateCategories.map(function (c) { return [c.code, c.name]; }), u.category) + '</select></div>' +
          '<div class="col-md-8"><label for="uName" class="form-label small fw-semibold">Municipality / ULB name <span class="text-danger">*</span></label><input id="uName" class="form-control form-control-sm" value="' + esc(u.name) + '"></div>' +
          '<div class="col-md-4"><label for="uWards" class="form-label small fw-semibold">No. of wards / areas <span class="text-danger">*</span></label><input id="uWards" type="number" min="1" max="60" class="form-control form-control-sm" value="' + esc(u.wardCount || App.wardsOf(u.code).length || '') + '"></div>' +
          (isNew ? '<div class="col-md-4"><label for="uCode" class="form-label small fw-semibold">Short code <span class="text-danger">*</span></label><input id="uCode" class="form-control form-control-sm text-uppercase" maxlength="4" placeholder="e.g. NMC"><div class="form-text">Used in the GR ID.</div></div>' : '') +
          '</div>' +
          '<details class="mt-3"' + (isNew ? '' : ' open') + '><summary class="small fw-semibold">Go-live (when the ULB starts using the system)</summary>' +
          (locked ? '<div class="alert alert-warning small py-2 mt-2 mb-0">This ULB is Live; the go-live dates are locked.</div>' : '') +
          '<div class="row g-2 mt-1"><div class="col-6 col-md-4"><label for="uCut" class="form-label small fw-semibold">Register cut-off date</label><input id="uCut" type="date" class="form-control form-control-sm" value="' + esc(u.cutOffDate || '') + '"' + (locked ? ' disabled' : '') + '></div>' +
          '<div class="col-6 col-md-4"><label for="uGo" class="form-label small fw-semibold">Go-live FY</label><input id="uGo" class="form-control form-control-sm" placeholder="2027-28" value="' + esc(u.goLiveFy || '') + '"' + (locked ? ' disabled' : '') + '></div>' +
          '<div class="col-md-4"><label for="uStatus" class="form-label small fw-semibold">Status</label><select id="uStatus" class="form-select form-select-sm"' + (locked ? ' disabled' : '') + '>' + opt([['Not started', 'Not live'], ['Data received', 'Data received'], ['Live', 'Live']], u.migrationStatus) + '</select></div></div></details>' +
          reasonField, 'Save', function () {
            var ok = need('uName', 'Enter the name.') & need('cReason', 'A reason is required.');
            var n = +v('uWards');
            ok = App.fieldError($('uWards'), n >= 1 && n <= 60 ? '' : 'Enter the number of wards.') && ok;
            if (isNew) {
              var code = v('uCode').toUpperCase();
              ok = App.fieldError($('uCode'), !code ? 'Enter a short code.' : D.config.ulbs.some(function (x) { return x.code === code; }) ? 'This code is already used.' : '') && ok;
            }
            var existing = App.wardsOf(u.code, true).length;
            if (!isNew && n < existing) ok = App.fieldError($('uWards'), 'This ULB already has ' + existing + ' wards. Wards are never deleted.') && false;
            var cut = v('uCut'), go = v('uGo'), st = v('uStatus');
            if (!locked) {
              if (go && !/^\d{4}-\d{2}$/.test(go)) ok = App.fieldError($('uGo'), 'Use the format 2027-28.') && false;
              else if (cut && go) {
                var expected = T.fyLabel(T.fyOfDate(T.toDate(cut)) + 1);
                ok = App.fieldError($('uGo'), go === expected ? '' : 'Go-live FY must be the year after the cut-off: ' + expected + '.') && ok;
              }
              if (st === 'Live' && (!cut || !go)) ok = App.fieldError($('uStatus'), 'Set the cut-off date and go-live FY first.') && false;
            }
            if (!ok) return false;
            var before = JSON.parse(JSON.stringify(u));
            if (isNew) { u.code = v('uCode').toUpperCase(); D.config.ulbs.push(u); }
            u.name = v('uName'); u.category = v('uCat'); u.district = v('uDist'); u.wardCount = n;
            if (!locked) { u.cutOffDate = cut || null; u.goLiveFy = go || null; u.migrationStatus = st; u.active = st === 'Live'; }
            // Create the missing wards as Ward k … Ward n.
            for (var k = existing + 1; k <= n; k++) D.config.wards.push({ ulb: u.code, code: 'W' + (k < 10 ? '0' : '') + k, name: 'Ward ' + k, localities: [] });
            App.audit({ grId: null, entity: 'ULB', action: (isNew ? 'ULB added ' : 'ULB updated ') + u.code + ' · ' + u.district + ' · ' + typeName(u.category) + ' · ' + n + ' wards', reason: v('cReason'), before: before, after: u });
            App.toast('ULB saved.');
          });
      }

      // ================= Masters 2: ULB → Wards → Localities =================
      function paneWards() {
        var cur = App.ulb(wardUlb);
        // Only the ULB is chosen; its district comes from the District → ULB master.
        var ulbOpts = D.config.ulbs.filter(function (u) { return !App.staffScope(session) || u.code === App.staffScope(session); }).map(function (u) { return '<option value="' + u.code + '"' + (u.code === wardUlb ? ' selected' : '') + '>' + esc(u.name) + '</option>'; }).join('');
        var rows = App.wardsOf(wardUlb, true).map(function (w) {
          var used = function (l) { return D.sites.filter(function (s) { return s.ulb === w.ulb && s.ward === w.code && s.locality === l; }).length; };
          var count = D.sites.filter(function (s) { return s.ulb === w.ulb && s.ward === w.code; }).length;
          var chips = (w.localities || []).map(function (l) {
            var n = used(l);
            return '<span class="badge rounded-pill text-bg-light border fw-normal me-1 mb-1 d-inline-flex align-items-center gap-1">' + esc(l) + (n ? ' <span class="text-muted">(' + n + ')</span>' : '') +
              (edit && !n ? '<button type="button" class="btn-close" style="width:.5rem;height:.5rem;" aria-label="Remove locality ' + esc(l) + '" data-lrem="' + w.code + '|' + esc(l) + '"></button>' : '') + '</span>';
          }).join('') || '<span class="small text-muted">No localities yet</span>';
          return '<tr><td class="fw-semibold small text-nowrap">' + esc(w.name) + '</td><td>' + chips + '</td><td class="text-end small">' + count + '</td>' +
            '<td class="text-end text-nowrap"><div class="d-inline-flex gap-1">' + btn('<i class="bi bi-plus" aria-hidden="true"></i>Locality', 'data-ladd="' + w.code + '"') + btn('Rename', 'data-wedit="' + w.code + '"', 'outline-secondary') + '</div></td></tr>';
        }).join('');
        return '<div class="row g-2 align-items-end mb-3" style="max-width:640px;"><div class="col-sm-8"><label for="wUlb" class="form-label small fw-semibold">Municipality / ULB</label><select id="wUlb" class="form-select form-select-sm">' + ulbOpts + '</select></div>' +
          '<div class="col-sm-4"><div class="small text-muted">District</div><div class="small fw-semibold">' + esc(cur.district) + '</div></div></div>' +
          card(esc(cur.name) + ' &ndash; ' + App.wardsOf(wardUlb, true).length + ' wards', table(['Ward', 'Localities', { t: 'Accounts', end: true }, { t: 'Action', end: true }], rows, 'Wards and localities') +
            '<div class="card-footer bg-white small text-muted">When a site is created, staff pick the ward and then one of its localities. A locality in use cannot be removed.</div>',
            btn('<i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Add Ward', 'id="btnAddWard"', 'primary'));
      }
      function wardForm(w) {
        var isNew = !w;
        open(isNew ? 'Add ward' : 'Rename ward', '<label for="wName" class="form-label small fw-semibold">Ward name <span class="text-danger">*</span></label><input id="wName" class="form-control form-control-sm" value="' + esc(w ? w.name : '') + '" placeholder="e.g. Arithang">' +
          (isNew ? '<label for="wLocs" class="form-label small fw-semibold mt-2">Localities</label><textarea id="wLocs" rows="3" class="form-control form-control-sm" placeholder="One locality per line"></textarea>' : '') + reasonField, 'Save', function () {
            if (!(need('wName', 'Enter the ward name.') & need('cReason', 'A reason is required.'))) return false;
            var before = w ? JSON.parse(JSON.stringify(w)) : null;
            if (isNew) {
              var k = App.wardsOf(wardUlb, true).length + 1;
              w = { ulb: wardUlb, code: 'W' + (k < 10 ? '0' : '') + k, localities: v('wLocs').split('\n').map(function (x) { return x.trim(); }).filter(Boolean), active: true };
              D.config.wards.push(w);
              var u = App.ulb(wardUlb); if (u.wardCount < k) u.wardCount = k;
            }
            w.name = v('wName');
            App.audit({ grId: null, entity: 'Ward', action: (isNew ? 'Ward added ' : 'Ward renamed ') + w.ulb + '/' + w.code + ' · ' + w.name, reason: v('cReason'), before: before, after: w });
            App.toast('Ward saved.');
          });
      }
      function localityForm(w) {
        open('Add locality to ' + esc(w.name), '<label for="lName" class="form-label small fw-semibold">Locality name(s) <span class="text-danger">*</span></label><textarea id="lName" rows="3" class="form-control form-control-sm" placeholder="One locality per line"></textarea>', 'Add', function () {
          var names = v('lName').split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
          if (!App.fieldError($('lName'), names.length ? '' : 'Enter at least one locality.')) return false;
          w.localities = w.localities || [];
          names.forEach(function (n) { if (w.localities.indexOf(n) === -1) w.localities.push(n); });
          App.audit({ grId: null, entity: 'Ward', action: 'Localities added to ' + w.ulb + '/' + w.name + ': ' + names.join(', ') });
          App.toast('Locality added.');
        });
      }

      // ================= Rates & Surcharge =================
      function targetName(r) {
        if (r.level === 'Category') { var c = D.config.rateCategories.filter(function (x) { return x.code === r.target; })[0]; return c ? c.name : r.target; }
        if (r.level === 'ULB') { var u = App.ulb(r.target); return u ? u.name : r.target; }
        var wp = r.target.split('/'); return App.ulb(wp[0]).name + ' – ' + App.wardName(wp[0], wp[1]);
      }
      function paneRates() {
        var sub = '<div class="btn-group btn-group-sm mb-3" role="group" aria-label="Rate tables"><button type="button" class="btn btn-' + (rateTab === 'rent' ? '' : 'outline-') + 'primary" data-rt="rent">Rent rates</button><button type="button" class="btn btn-' + (rateTab === 'sur' ? '' : 'outline-') + 'primary" data-rt="sur">Surcharge</button></div>';
        if (rateTab === 'rent') {
          var rows = D.config.rateRules.slice().sort(function (a, b) { return a.level === b.level ? (a.target === b.target ? (a.from < b.from ? 1 : -1) : (a.target < b.target ? -1 : 1)) : (a.level < b.level ? -1 : 1); }).map(function (r) {
            return '<tr><td class="small">' + esc(r.level) + '</td><td class="small fw-semibold">' + esc(targetName(r)) + '</td><td class="text-end fw-bold">' + inr(r.rate) + '</td><td class="small">' + App.fmtDate(r.from) + ' – ' + (r.to ? App.fmtDate(r.to) : 'in force') + '</td>' +
              '<td class="small">Notif. ' + esc(r.notificationNo || '—') + (r.gazetteNo ? ' &bull; Gazette ' + esc(r.gazetteNo) : '') + (r.gazetteFile ? '<div>' + App.fileLink(r.gazetteFile, null) + '</div>' : '') + '</td><td>' + (r.to ? App.pill('closed', 'Closed') : App.pill('paid', 'In force')) + '</td></tr>';
          }).join('');
          return sub + card('Rent rate history (₹ per 100 sq ft)', table(['Level', 'Applies to', { t: 'Rate', end: true }, 'Effective', 'Notification', 'Status'], rows, 'Rate history') +
            '<div class="card-footer bg-white small text-muted">Lookup order: Ward → ULB → Category; the most specific rate wins. A row cannot be edited once used; add a revision instead. Only rates from the go-live FY onward are needed.</div>', btn('<i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Add Revision', 'id="btnAddRate"', 'primary'));
        }
        var srows = D.config.surchargeRules.slice().sort(function (a, b) { return a.from < b.from ? 1 : -1; }).map(function (r) {
          return '<tr><td class="fw-bold">' + r.rate + '%</td><td class="small">' + App.fmtDate(r.from) + ' – ' + (r.to ? App.fmtDate(r.to) : 'in force') + '</td><td class="small">' + (r.method === 'ONCE_PER_OVERDUE_YEAR' ? 'Once per overdue year' : 'Per completed year of delay') + '</td><td class="small">' + esc(r.ref || '—') + '</td><td>' + (r.to ? App.pill('closed', 'Closed') : App.pill('paid', 'In force')) + '</td></tr>';
        }).join('');
        return sub + card('Surcharge history', table(['Rate', 'Effective', 'Method', 'Notification', 'Status'], srows, 'Surcharge history') +
          '<div class="card-footer bg-white small text-muted">Applied on 1 April after the 31 March due date at the rate in force that day. The method is pending confirmation (Q2). The certified opening balance is not surcharged again (Q12).</div>', btn('<i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Add Surcharge Revision', 'id="btnAddSur"', 'primary'));
      }

      function rateForm() {
        var catOpts = D.config.rateCategories.map(function (c) { return '<option value="' + c.code + '">' + esc(c.code + ' – ' + c.name) + '</option>'; }).join('');
        var ulbOpts = D.config.ulbs.map(function (u) { return '<option value="' + u.code + '">' + esc(u.name) + '</option>'; }).join('');
        var wardOpts = D.config.wards.map(function (w) { return '<option value="' + w.ulb + '/' + w.code + '">' + esc(App.ulb(w.ulb).name + ' – ' + w.name) + '</option>'; }).join('');
        open('Add rate revision', '<div class="row g-2"><div class="col-md-4"><label for="rLevel" class="form-label small fw-semibold">1. Level</label><select id="rLevel" class="form-select form-select-sm"><option>Category</option><option>ULB</option><option>Ward</option></select></div>' +
          '<div class="col-md-8"><label for="rTarget" class="form-label small fw-semibold">Target</label><select id="rTarget" class="form-select form-select-sm">' + catOpts + '</select></div>' +
          '<div class="col-6 col-md-4"><label for="rRate" class="form-label small fw-semibold">2. New rate / 100 sq ft <span class="text-danger">*</span></label><input id="rRate" type="number" min="1" class="form-control form-control-sm"></div>' +
          '<div class="col-6 col-md-4"><label for="rFrom" class="form-label small fw-semibold">Effective from <span class="text-danger">*</span></label><input id="rFrom" type="date" class="form-control form-control-sm"></div>' +

      // Compare each active site's rent for the FY of the effective date, old vs new rule set.
      function impact(level, target, rate, from) {
        var fy = T.fyOfDate(from);
        var test = JSON.parse(JSON.stringify(D));
        var prev = test.config.rateRules.filter(function (r) { return r.level === level && r.target === target && !r.to; })[0];
        if (prev && from > prev.from) { var db = T.toDate(from); db.setDate(db.getDate() - 1); prev.to = T.iso(db); }
        test.config.rateRules.push({ id: 'NEW', level: level, target: target, rate: rate, from: from, to: null });
        var asOf = T.iso(new Date(Math.max(T.toDate(D.demoToday), new Date(fy, 3, 1))));
        var res = { sites: 0, oldDemand: 0, newDemand: 0, fy: T.fyLabel(fy), fys: [], freeze: [] };
        var curFy = T.fyOfDate(D.demoToday);
        for (var y = fy; y <= curFy; y++) res.fys.push(T.fyLabel(y));
        D.sites.filter(function (s) { return s.status === 'Active' && App.ulb(s.ulb).goLiveFy; }).forEach(function (s) {
          var a = T.computeDues(s, asOf, D), b = T.computeDues(s, asOf, test);
          if (a.blocked || b.blocked) return;
          res.oldDemand += a.annualRent; res.newDemand += b.annualRent;
          var cur = T.computeDues(s, D.demoToday, D);
          var changed = a.annualRent !== b.annualRent;
          cur.years.forEach(function (yr) {
            if (yr.fy >= fy && yr.balance === 0) {
              var nb = T.computeDues(s, D.demoToday, test).years.filter(function (z) { return z.fy === yr.fy; })[0];
              if (nb && nb.rent !== yr.rent) { res.freeze.push({ grId: s.grId, fy: yr.label, rent: yr.rent }); changed = true; }
            }
          });
          if (changed) res.sites++;
        });
        return res;
      }

        on('[data-ulb]', function (b) { ulbForm(App.ulb(b.getAttribute('data-ulb'))); });
        on('#btnAddUlb', function () { ulbForm(null); });
        on('[data-goward]', function (b) { wardUlb = b.getAttribute('data-goward'); tab = 'wards'; history.replaceState(null, '', '#wards'); render(); });
        on('[data-wedit]', function (b) { wardForm(App.ward(wardUlb, b.getAttribute('data-wedit'))); });
        on('[data-ladd]', function (b) { localityForm(App.ward(wardUlb, b.getAttribute('data-ladd'))); });
        on('[data-lrem]', function (b) {
          var parts = b.getAttribute('data-lrem').split('|'), w = App.ward(wardUlb, parts[0]), name = parts.slice(1).join('|');
          w.localities = w.localities.filter(function (l) { return l !== name; });
          App.audit({ grId: null, entity: 'Ward', action: 'Locality removed from ' + w.ulb + '/' + w.name + ': ' + name });
          App.save(); App.toast('Locality removed.'); render();
        });
        on('#btnAddWard', function () { wardForm(null); });
        on('[data-rt]', function (b) { rateTab = b.getAttribute('data-rt'); render(); });
        on('#btnAddRate', rateForm);
        on('#btnAddSur', surForm);
        on('[data-rule]', function (b) { ruleForm(b.getAttribute('data-rule')); });
        on('[data-list]', function (b) { listForm(b.getAttribute('data-list')); });
        on('[data-lren]', function (b) {
          var list = D.config.lists.structureTypes, i = +b.getAttribute('data-lren'), old = list[i];
          open('Rename structure kind', '<label for="lVal" class="form-label small fw-semibold">Name <span class="text-danger">*</span></label><input id="lVal" class="form-control form-control-sm" value="' + esc(old) + '"><div class="form-text">Structures already recorded with this kind are renamed too.</div>' + reasonField, 'Save', function () {
            if (!(need('lVal', 'Enter a name.') & need('cReason', 'A reason is required.'))) return false;
            var nv = v('lVal');
            if (nv !== old && list.indexOf(nv) !== -1) return App.fieldError($('lVal'), 'This kind already exists.') && false;
            list[i] = nv;
            D.sites.forEach(function (st) { st.structures.forEach(function (x) { if (x.type === old) x.type = nv; }); });
            App.audit({ entity: 'List', grId: null, action: 'Structure kind renamed: ' + old + ' → ' + nv, reason: v('cReason') });
            App.toast('Structure kind renamed.');
          });
        });
        on('[data-ldel]', function (b) {
          var list = D.config.lists.structureTypes, i = +b.getAttribute('data-ldel'), old = list[i];
          open('Remove structure kind', '<p class="small">Remove <strong>' + esc(old) + '</strong> from the list? No structure uses it.</p>' + reasonField, 'Remove', function () {
            if (!need('cReason', 'A reason is required.')) return false;
            list.splice(i, 1);
            App.audit({ entity: 'List', grId: null, action: 'Structure kind removed: ' + old, reason: v('cReason') });
            App.toast('Structure kind removed.');
          }, 'danger');
        });
        on('[data-user]', function (b) { userForm(b.getAttribute('data-user')); });
        var wu = $('wUlb');
        if (wu) wu.addEventListener('change', function () { wardUlb = wu.value; render(); });
      }
      render();
    })();
  </script>
</body>
</html>
