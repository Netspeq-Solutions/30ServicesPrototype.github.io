<!DOCTYPE html>
<html lang="en" data-font-size="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Approval Queue | Online Ground Rent Payment System | Government of Sikkim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../common/css/gigw-template.css">
  <link rel="stylesheet" href="../../common/css/themes.css">
  <link rel="stylesheet" href="../../common/css/components.css">
  <link rel="stylesheet" href="../../common/css/responsive.css">
  <link rel="stylesheet" href="gr-common.css">
</head>
<body data-theme="teal">
  <main id="main-content">
    <h1 class="h4 fw-bold mb-1">Approval Queue</h1>
    <p class="text-muted small mb-3">Supervisor transfers and structure changes waiting for Dept. Admin approval (maker–checker).</p>
    <div id="mcState"></div>
    <div class="card border-0 shadow-xs">
      <div class="gov-table-desktop table-responsive"><table class="table gov-table-compact table-hover mb-0"><caption class="visually-hidden">Approval requests</caption>
        <thead><tr><th scope="col" style="width:12%">Request</th><th scope="col" style="width:18%">GR ID</th><th scope="col" style="width:32%">Change</th><th scope="col" style="width:14%">Submitted</th><th scope="col" style="width:10%">Status</th><th scope="col" class="text-end" style="width:14%">Action</th></tr></thead>
        <tbody id="qBody"></tbody></table></div>
      <div class="gov-cards-mobile p-3" id="qCards"></div>
    </div>
  </main>

  <div class="modal fade" id="returnModal" tabindex="-1" aria-labelledby="returnModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="returnForm" novalidate>
      <div class="modal-header"><h2 class="modal-title h6 fw-bold" id="returnModalLabel">Return with comment</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><label for="retComment" class="form-label small fw-semibold">Remarks for the Supervisor <span class="text-danger">*</span></label><textarea id="retComment" class="form-control form-control-sm" rows="3"></textarea></div>
      <div class="modal-footer"><button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-sm btn-warning">Return for Correction</button></div>
    </form></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="mock-data.js"></script>
  <script src="dues-engine.js"></script>
  <script src="gr-app.js"></script>
  <script src="gr-staff.js"></script>
  <script>
    (function () {
      'use strict';
      var App = window.GRApp, S = window.GRStaff, D = App.data, esc = App.esc;
      var session = App.requireSession('staff', 'approve');
      if (!session) return;
      App.shell({ type: 'staff', active: 'approvals' });
      var retModal = new bootstrap.Modal(document.getElementById('returnModal'));
      var returning = null;

      document.getElementById('mcState').innerHTML = D.config.settings.makerChecker
        ? '<div class="alert alert-info small py-2"><i class="bi bi-check2-square me-1" aria-hidden="true"></i>Maker–checker approval is <strong>on</strong>.</div>'
        : '<div class="alert alert-light border small py-2"><i class="bi bi-info-circle me-1" aria-hidden="true"></i>Maker–checker approval is <strong>off</strong> (pilot default), so Supervisor changes are saved directly. A System Admin can switch it on under Configuration &rarr; Global Rules.</div>';

      function render() {
        var list = D.approvals.filter(function (a) { var s = App.site(a.grId); return s && App.inScope(s, session); });
        var rows = list.map(function (a) {
          var p = a.status === 'Submitted' ? App.pill('pending', 'Submitted') : a.status === 'Approved' ? App.pill('paid', 'Approved') : App.pill('failed', 'Returned');
          var act = a.status === 'Submitted' ? '<div class="d-inline-flex align-items-center gap-1 text-nowrap"><button type="button" class="btn btn-sm btn-success" data-approve="' + a.id + '">Approve</button><button type="button" class="btn btn-sm btn-outline-warning" data-return="' + a.id + '">Return</button></div>'
            : '<span class="small text-muted">' + esc(a.decidedBy || '') + '</span>';
          var change = esc(S.describe(a.type, a.payload)) + '<div class="small text-muted">' + esc(a.comment) + (a.file ? ' &bull; ' + App.fileLink(a.file, a.grId) : '') + (a.returnComment ? '<br>Returned: ' + esc(a.returnComment) : '') + '</div>';
          return {
            row: '<tr><td class="font-monospace small fw-bold">' + esc(a.id) + '</td><td><a class="gr-gr-id small" href="ledger.html?gr=' + encodeURIComponent(a.grId) + '">' + esc(a.grId) + '</a></td><td>' + change + '</td><td class="small">' + esc(a.submittedBy) + '<div class="text-muted">' + esc(a.submittedAt) + '</div></td><td>' + p + '</td><td class="text-end text-nowrap">' + act + '</td></tr>',
            card: '<div class="gov-mobile-app-card"><div class="d-flex justify-content-between align-items-start gap-2 mb-1"><span class="font-monospace fw-bold small">' + esc(a.id) + '</span>' + p + '</div><div class="gr-gr-id small">' + esc(a.grId) + '</div><div class="small">' + change + '</div><div class="d-flex justify-content-end mt-2">' + act + '</div></div>'
          };
        });
        var empty = 'No requests waiting.';
        document.getElementById('qBody').innerHTML = rows.map(function (r) { return r.row; }).join('') || '<tr><td colspan="6" class="text-center text-muted py-4">' + empty + '</td></tr>';
        document.getElementById('qCards').innerHTML = rows.map(function (r) { return r.card; }).join('') || '<p class="text-center text-muted small mb-0">' + empty + '</p>';
        document.querySelectorAll('[data-approve]').forEach(function (b) {
          b.addEventListener('click', function () {
            var a = D.approvals.filter(function (x) { return x.id === b.getAttribute('data-approve'); })[0];
            var site = App.site(a.grId);
            var desc = S.applyChange(a.type, site, a.payload);
            a.status = 'Approved'; a.decidedBy = D.staffRoles[session.role].user; a.decidedAt = App.stamp();
            App.audit({ grId: a.grId, entity: a.type, action: 'Approved ' + a.id + ' · ' + desc, reason: a.comment, file: a.file });
            App.save(); App.toast('Request ' + a.id + ' approved and applied.'); render();
          });
        });
        document.querySelectorAll('[data-return]').forEach(function (b) {
          b.addEventListener('click', function () { returning = b.getAttribute('data-return'); document.getElementById('retComment').value = ''; retModal.show(); });
        });
      }
      document.getElementById('returnForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var c = document.getElementById('retComment');
        if (!App.fieldError(c, c.value.trim() ? '' : 'Remarks are required.')) return;
        var a = D.approvals.filter(function (x) { return x.id === returning; })[0];
        a.status = 'Returned'; a.returnComment = c.value.trim(); a.decidedBy = D.staffRoles[session.role].user; a.decidedAt = App.stamp();
        App.audit({ grId: a.grId, entity: a.type, action: 'Returned for correction ' + a.id, reason: a.returnComment });
        App.save(); retModal.hide(); App.toast('Request returned to the Supervisor.', 'warning'); render();
      });
      render();
    })();
  </script>
</body>
</html>
